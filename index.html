'Rhythm and tempo are identical~Tempo is pulse speed; rhythm is the pattern within time.^Musical systems everywhere use the same scales~Traditions organise pitch and time differently.',
'At 60 beats per minute, how long is one beat?~One second.^What changes when a violin replaces a flute on the same note?~Timbre, among other performance details.^Can rhythm change without tempo changing?~Yes; durations and accents can change over the same pulse.',
'Explore melody and repeated musical phrases.','physics~Explains vibration and sound.^anthropology~Studies music in cultural life.');
L('arts','architecture','Architecture',
'People~Use and access^Space~Arrangement and movement^Structure~Support and materials^Climate~Light, heat and air^Place~Culture and surroundings',
'Form serves multiple needs~Buildings combine function, experience and expression. A library needs both quiet areas and circulation.^Structure and space interact~Supports influence usable arrangements. Columns can limit furniture placement.^Climate shapes comfort~Orientation, shading and ventilation affect conditions. External shade can reduce solar heat gain.^Access should be designed in~Different bodies and abilities need usable routes. A step-free entrance improves access for many people.^Place gives context~Buildings affect neighbours and shared environments. A tall wall may shade an adjoining courtyard.',
'Plan~Drawing showing a horizontal view through a building.^Section~Drawing showing a vertical cut.^Circulation~Routes people use through spaces.^Scale~Relationship between drawing size and actual size.^Orientation~Direction a building faces or is arranged toward.',
'Sketch a rectangular room 4 m by 3 m.^At a scale of 1:50, 1 cm represents 50 cm in reality.^Convert 4 m to 400 cm: draw 8 cm. Convert 3 m to 300 cm: draw 6 cm.^Add a door and furniture to test movement. A sketch does not establish structural safety or compliance with local building and accessibility rules.',
'Architecture is only appearance~Use, construction, environment and access also shape design.^A floor plan proves a building will work~Sections, technical checks and user experience reveal other issues.',
'How long is 3 m at 1:50?~6 cm.^Why consider orientation?~It changes sunlight, heat and sometimes ventilation opportunities.^Why test movement around furniture?~Objects can obstruct circulation and access.',
'Compare plans and sections of a small public space.','civil-engineering~Checks structural and ground systems.^ux-design~Studies how people use designed environments.');
L('arts','graphic-design','Graphic design',
'Purpose~Audience and message^Hierarchy~Order of attention^Typography~Readable language^Layout~Alignment and spacing^Production~Medium and constraints',
'Hierarchy guides reading~Visual emphasis signals importance. A clear event title precedes secondary details.^Contrast creates distinction~Differences should support meaning. Dark text on a pale background improves legibility.^Alignment builds relationships~Shared edges suggest organisation. Aligned labels make a form easier to scan.^Consistency reduces effort~Repeated styles teach expectations. Identical headings signal equivalent sections.^Design must survive its medium~Print and screens impose different constraints. Tiny poster text may fail on a phone.',
'Typography~Selection and arrangement of type.^Hierarchy~Order of visual importance.^Whitespace~Unoccupied space helping separation and focus.^Grid~Framework for aligning elements.^Legibility~Ease of recognising text characters.',
'Design a simple workshop notice.^Choose three levels: title, date and location, then supporting details.^Use one readable type family, consistent alignment and generous spacing.^View it at phone size and in greyscale. If key details disappear, adjust size, contrast or placement rather than adding decoration.',
'More fonts make a message clearer~Too many styles can weaken hierarchy.^Whitespace is wasted space~It can improve grouping, clarity and focus.',
'Which details should a workshop notice make easy to find?~What it is, when it happens and where it is.^Why test in greyscale?~To detect meaning or contrast that relies too much on colour.^What does alignment communicate?~Order and relationships among elements.',
'Practise typography and accessible colour contrast.','visual-arts~Develops composition skills.^ux-design~Extends communication into interaction.');
L('arts','ux-design','UX design',
'Users~Needs and context^Tasks~Goals and journeys^Structure~Information and navigation^Interaction~Feedback and control^Evaluation~Usability and access',
'Start from real tasks~Design supports what people need to do. A booking page should make dates and availability clear.^Visibility reduces guessing~Show state and available actions. A saved indicator confirms a successful edit.^Consistency supports prediction~Familiar patterns reduce learning. Similar buttons should behave similarly.^Error recovery matters~People need ways to prevent and correct mistakes. A review step helps catch a wrong address.^Accessibility expands usability~Keyboard, visual and cognitive needs belong in design. A labelled field helps both screen-reader and sighted users.',
'UX~User experience: a person’s overall experience of using something.^Usability~How effectively and comfortably people complete tasks.^Prototype~Testable early design.^Affordance~Possible action offered by an object or interface.^Feedback~Information about the result or state of an action.',
'Test a prototype appointment form with a consenting participant.^Ask them to book a fictional date without coaching their clicks.^Observe where they hesitate and ask neutral follow-up questions.^If the date format confuses them, clarify it and test again. One session reveals possible problems, not a population-wide success rate.',
'UX is only making screens attractive~It concerns tasks, usefulness, access and the wider experience.^Designers can fully represent users by guessing~Research and testing reveal needs assumptions miss.',
'Why avoid coaching during a usability task?~Coaching can hide problems in the design.^What feedback should a save action provide?~Clear confirmation or an understandable error.^Does one successful test prove universal usability?~No; users and contexts differ.',
'Practise task-based testing and accessible form design.','software-development~Implements interactions.^psychology~Explains attention and mental effort.');
L('arts','film','Film',
'Story~Events and viewpoint^Image~Framing and movement^Sound~Voice, music and space^Editing~Sequence and duration^Context~Audience and interpretation',
'Framing selects information~A shot includes some things and excludes others. A close-up directs attention to a reaction.^Editing creates relationships~Sequence influences interpretation. A face followed by food may suggest hunger.^Sound changes meaning~Audio can reveal or imply unseen events. Footsteps can establish an off-screen presence.^Duration shapes experience~Pacing influences tension and attention. A long pause can create discomfort.^Representation is constructed~Documentary images also involve choices. Selection and editing affect the account viewers receive.',
'Shot~Continuous recorded view between cuts.^Frame~Boundaries of the visible image.^Cut~Transition from one shot to another.^Diegetic sound~Sound belonging to the story world.^Montage~Arrangement of shots whose combination creates meaning.',
'Plan a three-shot scene about missing a bus.^Shot one establishes a person approaching a stop; shot two shows the bus leaving.^Shot three shows the person’s response. Add bus sound that matches the action.^Reverse the first two shots and notice how timing and inferred cause change. This is a storytelling exercise, not a universal formula.',
'The camera records an entirely neutral truth~Framing, timing and editing select a perspective.^More cuts always make a film exciting~Pacing depends on meaning, performance, sound and duration.',
'What does an establishing shot help clarify?~Setting and spatial relationships.^Why can shot order change meaning?~Viewers infer relationships and causes from sequence.^Is background music always diegetic?~No; it is diegetic only when it belongs to the story world.',
'Compare the same scene edited at two different paces.','literature~Studies narrative and viewpoint.^music~Explores sound patterns and emotion.');
L('education','teaching-methods','Teaching methods',
'Goals~What learners can do^Prior knowledge~Starting points^Explanation~Models and examples^Practice~Recall and application^Feedback~Adjust teaching',
'Prior knowledge shapes learning~New ideas connect to existing understanding. Check fractions before teaching ratios.^Cognitive load is limited~Too much new detail can overwhelm working memory. Teach a procedure in manageable steps.^Retrieval strengthens access~Recalling practises remembering. A short low-stakes quiz reveals gaps.^Feedback should guide action~Useful feedback identifies a next step. “Check the units” helps more than “wrong”.^Transfer needs varied practice~Learners must recognise ideas in new contexts. Apply percentages to both discounts and recipes.',
'Scaffolding~Temporary support reduced as competence grows.^Retrieval~Bringing information to mind.^Formative assessment~Evidence used to improve ongoing learning.^Transfer~Using learning in a different situation.^Cognitive load~Demand placed on limited working memory.',
'Teach how to calculate 10% of a price.^First ask what “per hundred” means and check division by ten.^Model 10% of 80 as 8, then have the learner explain 10% of 50.^Use a new context, such as 10% of 30 litres, and give feedback. Success on one memorised example is not enough.',
'Preferred learning styles determine how a person must be taught~Evidence does not support matching all instruction to fixed visual or auditory types.^Rereading always means understanding~Learners also need recall, explanation and application.',
'What is 10% of 30 litres?~3 litres.^Why check prior knowledge?~Missing foundations can block a new explanation.^What makes feedback actionable?~It identifies a concrete way to improve.',
'Compare worked examples with guided and independent practice.','psychology~Explains memory and attention.^curriculum-design~Sequences goals and assessment.');
L('education','curriculum-design','Curriculum design',
'Purpose~Learners and goals^Sequence~Dependencies^Content~Scope and selection^Assessment~Evidence of learning^Review~Inclusion and revision',
'Alignment supports coherence~Goals, activities and assessment should match. A speaking goal needs speaking practice and evidence.^Sequence follows dependencies~Teach foundations before demanding their use. Fractions support proportional reasoning.^Depth needs selection~Limited time requires priorities. Fewer well-understood concepts may serve beginners better.^Assessment samples capability~One test cannot show everything. Combine explanation with a practical task.^Review uses evidence~Curricula improve through learner outcomes and feedback. Persistent confusion may signal a missing bridge lesson.',
'Learning outcome~Observable capability intended after learning.^Scope~Breadth and limits of content.^Sequence~Planned order of learning.^Alignment~Fit between goals, teaching and assessment.^Rubric~Criteria describing levels of performance.',
'Design a short unit on household budgeting.^Outcome: create and explain a balanced monthly budget.^Sequence income and expenses, categories, then trade-offs; practise using fictional figures.^Assess a new budget plus an explanation of one choice. A vocabulary-only quiz would not fully assess the stated outcome.',
'A curriculum is just a topic list~It also connects purposes, sequence, teaching and assessment.^More coverage guarantees more learning~Overload can reduce understanding and retention.',
'Why is a vocabulary quiz insufficient here?~The goal requires making and explaining a budget.^What should come before complex trade-offs?~Understanding income, expenses and basic calculations.^Why use a rubric?~To make assessment criteria and expectations clear.',
'Build a small outcome-to-assessment map.','teaching-methods~Turns sequences into learning activities.^project-management~Helps plan implementation.');
L('education','child-development','Child development',
'Domains~Body, thought and emotion^Relationships~Care and interaction^Play~Exploration and practice^Variation~Different pathways^Context~Culture and conditions',
'Domains interact~Physical, language and social development influence each other. Movement can open new opportunities for exploration.^Responsive relationships matter~Consistent, responsive interaction supports development. Taking turns in conversation provides language practice.^Development varies~Milestones describe ranges, not identical schedules. Children may acquire skills at different times.^Play supports learning~Exploration can practise coordination and reasoning. Building blocks combines motor and spatial skills.^Context affects opportunity~Health, culture and resources shape experience. A quiet child may speak differently across settings.',
'Milestone~Skill commonly emerging within an approximate developmental period.^Motor skill~Controlled movement ability.^Attachment~Enduring emotional bond with a caregiver.^Self-regulation~Managing attention, emotion or behaviour.^Developmental domain~Area such as physical, cognitive or social development.',
'A caregiver wants to support a child’s turn-taking in play.^Choose a simple shared activity suitable for the child’s abilities.^Model a turn, pause, respond to the child’s attempt and keep the interaction encouraging.^Observe across occasions and settings rather than drawing conclusions from one attempt. Concerns need qualified developmental advice, not diagnosis from this exercise.',
'Every child must reach every skill on the same birthday~Developmental timing varies; persistent concerns still deserve professional assessment.^One behaviour proves a diagnosis~Assessment needs broader evidence and context.',
'Why observe in more than one setting?~Behaviour depends partly on context.^How can block play support several domains?~It combines movement, spatial thinking and often social interaction.^What should a milestone be treated as?~An approximate developmental reference, not a rigid deadline.',
'Learn responsive interaction and age-appropriate play. Guidance varies with individual development and local services.','psychology~Studies learning and emotion.^teaching-methods~Adapts support to learners.');
L('environment','climate-science','Climate science',
'Energy~Incoming and outgoing heat^Atmosphere~Greenhouse effect^Cycles~Carbon and water^Variability~Patterns over time^Evidence~Observations and models',
'Energy balance controls temperature~Climate responds to energy entering and leaving Earth. Less outgoing energy initially causes warming.^Greenhouse gases affect radiation~They absorb and emit infrared energy. Added carbon dioxide changes Earth’s energy balance.^Weather differs from climate~Climate concerns long-term patterns and variation. One cold day cannot refute a warming trend.^Feedbacks alter responses~Changes can reinforce or reduce an initial effect. Less ice can increase absorbed sunlight.^Attribution uses multiple evidence lines~Scientists compare observations, physics and models. Recent warming cannot be explained by a single local temperature reading.',
'Climate~Long-term statistical patterns of weather.^Greenhouse gas~Gas absorbing and emitting infrared radiation.^Feedback~Process altering an initial change.^Mitigation~Reducing causes of climate change.^Adaptation~Adjusting to actual or expected impacts.',
'Compare two hypothetical 30-year temperature averages for the same location.^The earlier mean is 20.0°C and the later mean 20.8°C.^The difference is 0.8°C; it is not calculated by selecting the hottest day.^Check measurement consistency, uncertainty and regional context. A local trend alone does not quantify global warming or identify every cause.',
'A cold day disproves warming~Daily weather varies within long-term climate trends.^The greenhouse effect is entirely harmful~The natural effect keeps Earth warmer; added gases change the balance.',
'What is the difference between the two means?~0.8°C.^Is flood-resilient planning mitigation or adaptation?~Primarily adaptation.^Why use long periods?~To distinguish persistent patterns from short-term variability.',
'Study the carbon cycle and evidence for climate attribution.','earth-science~Connects oceans, rocks and atmosphere.^statistics~Separates trends from variability.');
L('environment','sustainability','Sustainability',
'Systems~Connected effects^Resources~Stocks and flows^Lifecycles~Production to disposal^Fairness~People and generations^Evaluation~Indicators and trade-offs',
'Boundaries shape conclusions~Include relevant upstream and downstream effects. A reusable cup has production as well as washing impacts.^Stocks differ from flows~Using a resource faster than renewal depletes it. Pumping can lower groundwater storage.^Trade-offs need explicit goals~Environmental and social outcomes may conflict. A low-cost material may have a larger footprint.^Efficiency is not total reduction~Lower use per unit can be offset by more units. Efficient cars do not automatically reduce total driving.^Fairness spans people and time~Costs and benefits fall unevenly. A project should consider downstream communities and future users.',
'Lifecycle~Stages from resource extraction through use and disposal.^Renewable~Replenished on relevant human timescales.^Footprint~Measure of a specified environmental demand or impact.^Circularity~Keeping materials in use through reuse, repair or recovery.^Rebound effect~Extra use offsetting some efficiency gains.',
'A hypothetical device originally uses 10 kWh monthly; a new model uses 8 kWh for the same service.^Per-device electricity use falls by 2 kWh, or 20%.^If device numbers rise from 10 to 15, total use changes from 100 to 120 kWh.^Efficiency improved while total use rose. This covers use-phase electricity only, not full lifecycle impacts.',
'Recyclable means actually recycled~Collection, processing and market conditions affect recovery.^One green indicator proves overall sustainability~Other impacts and social consequences may be missing.',
'Did total electricity use fall in the example?~No; it rose from 100 to 120 kWh.^Why define a system boundary?~It states which effects are included and excluded.^What is a renewable resource limitation?~Use can still exceed its renewal rate.',
'Try a simple lifecycle comparison with clear boundaries.','economics~Explains incentives and external effects.^climate-science~Measures one major environmental challenge.');
L('environment','farming','Farming',
'Soil~Structure and life^Water~Supply and drainage^Crops~Growth and nutrition^Protection~Pests and resilience^Farm system~Records and economics',
'Limiting factors constrain growth~One shortage can limit yield despite abundant other inputs. More fertiliser cannot replace missing water.^Soil is a living system~Structure and organisms affect root conditions. Compaction can reduce air and water movement.^Timing matters~Actions must fit crop stage and local conditions. Water demand changes as plants grow.^Integrated management reduces reliance~Combine prevention, monitoring and appropriate control. Rotation can help disrupt some pest cycles.^Records support comparison~Track inputs and outcomes. Comparing fields requires noting soil, weather and variety differences.',
'Yield~Harvested output per stated area or animal.^Soil fertility~Capacity of soil to supply nutrients under given conditions.^Irrigation~Deliberate water supply to crops.^Crop rotation~Changing crops in a planned sequence.^Integrated pest management~Combining monitoring and multiple appropriate pest-control methods.',
'A hypothetical plot of 200 m² produces 600 kg of harvested crop.^Yield = 600 ÷ 200 = 3 kg/m².^For comparison, record crop type, season and whether weight includes rejected produce.^Do not assume another field will give the same result. Soil, climate, management and measurement differ; input choices need local agronomic guidance.',
'More fertiliser always means more yield~Other limits, pollution and crop damage can intervene.^One successful season proves a method~Weather and other differences can explain results.',
'What is this plot’s yield?~3 kg per square metre.^Why record the season?~Weather and growing conditions influence comparisons.^Can nutrients replace water?~No; water may be the limiting factor.',
'Study soil testing and crop water needs with local extension guidance.','biology~Explains plant growth.^accounting~Tracks farm costs and returns.');
L('environment','animal-science','Animal science',
'Biology~Growth and reproduction^Nutrition~Needs and feed^Health~Prevention and observation^Welfare~Behaviour and environment^Production~Records and systems',
'Needs vary by animal~Species, age and life stage affect care. A growing animal has different needs from a mature one.^Nutrition requires balance~Energy alone is insufficient. Protein, minerals, water and other needs must also be met.^Prevention supports health~Hygiene and appropriate management reduce risk. Clean housing can limit some pathogen exposure.^Welfare includes behaviour~Health alone does not capture experience. Space and suitable enrichment can affect wellbeing.^Records reveal trends~Group averages can hide individual problems. Falling intake may prompt observation and veterinary advice.',
'Ration~Feed allocation or mixture over a stated period.^Biosecurity~Measures reducing disease introduction and spread.^Welfare~Animal’s physical and mental state in its conditions.^Husbandry~Care and management of animals.^Feed conversion ratio~Feed input divided by a specified output, with definitions stated.',
'Simplified group record: animals consume 100 kg of measured feed and gain 50 kg of total body mass over the same period.^Feed conversion ratio = 100 ÷ 50 = 2 kg feed per kg gain.^Compare only records with consistent feed, weight and time definitions.^A lower ratio alone does not prove better welfare or profitability. Mortality, health, feed quality and cost also matter.',
'Higher production always proves good welfare~Output alone cannot assess behaviour, comfort or suffering.^The same ration suits every species~Requirements and safe feeds differ substantially.',
'What is the ratio in the example?~2 kg feed per kg gain.^Why define the measurement period?~Input and output must refer to comparable time.^Who should assess a suspected illness?~A qualified veterinarian or appropriate local animal-health professional.',

L('practical','trades','Trades',
'Planning~Scope and sequence^Measurement~Units and tolerances^Materials~Selection and behaviour^Tools~Fit and safe use^Quality~Inspection and standards',
'Measure before committing~Check dimensions and reference points. A second measurement can prevent a wasted board.^Tolerance defines acceptable variation~No measurement is infinitely exact. Parts need suitable fit rather than imagined perfection.^Sequence affects results~Some work depends on earlier preparation. Finishing before correcting alignment can waste effort.^Tools must fit the task~Suitable tools and training reduce errors. A wrong fastener can damage a material.^Inspection is part of work~Verify the result against requirements. A level-looking surface still needs appropriate checks.',
'Trade~Skilled practical occupation.^Tolerance~Allowed variation from a specified dimension or condition.^Datum~Reference point or surface for measurement.^Specification~Stated requirement for work or materials.^Personal protective equipment~Equipment worn to reduce specific exposure risks.',
'Paper planning exercise: a shelf opening measures 800 mm.^Assume the design calls for a 2 mm clearance at each side.^Planned shelf width = 800 − 2 − 2 = 796 mm.^Check the opening at several points and confirm the design requirement before real work. This is not instruction for structural, electrical or other regulated work.',
'Protective equipment makes any method safe~Hazard elimination, safe methods and competence remain necessary.^A tighter fit is always better~Materials may expand, and the design may require clearance.',
'What width does the example specify?~796 mm.^Why use a datum?~To keep measurements referenced consistently.^Why measure at several points?~The opening may vary or be out of square.',

L('practical','hospitality','Hospitality',
'Guests~Needs and expectations^Service~Consistent delivery^Operations~Capacity and timing^Hygiene~Risk control^Recovery~Responding to problems',
'Service is an end-to-end experience~Small failures can affect the whole visit. A correct booking still needs a clear arrival process.^Capacity limits promises~Demand must fit resources. Accepting too many bookings can undermine service.^Hygiene relies on systems~Reliable procedures matter more than appearances. A clean-looking surface may still need proper sanitation.^Communication prevents errors~Confirm important needs clearly. Record an allergy concern and follow the venue’s trained procedure.^Recovery needs ownership~Acknowledge a problem and provide a realistic response. Explain a delay rather than leaving guests uncertain.',
'Occupancy~Share of available accommodation units in use over a stated period.^Reservation~Advance booking.^Service standard~Defined expected level of delivery.^Cross-contamination~Transfer of harmful contaminants between sources.^Service recovery~Response intended to resolve a service failure.',
'A fictional hotel has 40 rooms available tonight and 30 occupied.^Occupancy = occupied rooms ÷ available rooms × 100 = 30 ÷ 40 × 100 = 75%.^Ten rooms remain available, assuming none are out of service.^Occupancy alone does not show profit or guest satisfaction. Food and accommodation operations must follow current local health and safety requirements.',
'Full occupancy always means strong profit~Price, staffing, costs and service quality also matter.^An allergy request is a preference to guess about~It needs trained handling and accurate communication; do not promise safety without proper verification.',
'What is the example’s occupancy?~75%.^Why confirm important guest needs?~Miscommunication can cause service or safety failures.^Why is appearance insufficient for hygiene?~Some hazards are not visible.',

L('practical','logistics','Logistics',
'Demand~What and when^Inventory~Stock and uncertainty^Transport~Routes and capacity^Warehousing~Storage and picking^Information~Tracking and coordination',
'Flows need coordination~Goods and information must agree. A shipment record should match what was dispatched.^Lead time creates exposure~Demand continues while replenishment is travelling. Delayed supply can cause a stockout.^Buffers trade cost for resilience~Extra stock can absorb variation but ties up resources. Safety stock reduces some shortage risk.^Bottlenecks constrain throughput~The slowest effective stage can limit the system. Faster picking cannot fix a blocked dispatch dock.^Accuracy supports traceability~Identifiers and counts must remain reliable. A wrong item code can send stock to the wrong customer.',
'Lead time~Time from an order or process start to its completion.^Inventory~Goods held for use or sale.^Stockout~Unavailable stock when needed.^Reorder point~Inventory position triggering replenishment.^Throughput~Output passing through a system per unit time.',
'Assume stable demand of 5 units daily and a four-day replenishment lead time.^Expected lead-time demand = 5 × 4 = 20 units.^With a chosen safety buffer of 6 units, a simple reorder point is 26 units.^Track inventory position, including on-order stock and commitments. Real demand variation and service targets require a more careful model.',
'Zero stock is always most efficient~It may create costly shortages and disruption.^Fastest transport is always best~Cost, reliability, capacity and environmental effects also matter.',
'What is expected lead-time demand?~20 units.^What is the example reorder point?~26 units.^Why track goods already ordered?~Otherwise repeated orders may create excess stock.',
'Study inventory accuracy and warehouse process mapping.','statistics~Models demand variation.^accounting~Records inventory value and costs.','Basic arithmetic and simple stock records.');
L('practical','project-management','Project management',
'Purpose~Outcomes and scope^Planning~Tasks and dependencies^Resources~Time and budget^Risk~Uncertainty and response^Delivery~Review and learning',
'Scope defines boundaries~Agree what the project delivers. A website project needs an explicit lesson count.^Dependencies shape schedules~Some tasks must precede others. Review requires a draft to review.^Constraints interact~Time, cost, quality and scope affect each other. More content may require more time.^Risk is uncertainty with consequences~Plan responses before problems occur. A backup supplier can reduce delay exposure.^Progress needs evidence~Completed work should meet acceptance criteria. A working feature demonstrates more than a percentage estimate.',
'Scope~Agreed boundaries of work and deliverables.^Milestone~Significant checkpoint.^Dependency~Relationship requiring an activity or condition before another.^Risk~Uncertain event or condition affecting objectives.^Acceptance criteria~Conditions for agreeing a deliverable is satisfactory.',
'A simple project has writing lasting 2 days, review lasting 1 day and formatting lasting 1 day.^Assume review follows writing and formatting follows review.^The minimum sequential duration is 2 + 1 + 1 = 4 working days.^This ignores waiting, rework and resource limits. Add justified buffers and verify the final output against acceptance criteria.',

'Can review start before the draft in this plan?~No; it depends on writing being complete.^What is the minimum stated duration?~Four working days under the assumptions.^Why define acceptance criteria early?~They clarify what “done” means and guide verification.',

const introductions={
 'physics':'Physics studies matter, energy, motion and the forces that change them. Here you learn how to explain everyday events such as a cart speeding up, brakes getting warm and sound travelling.',
 'chemistry':'Chemistry studies what substances are made of, how their particles join together and how substances change in reactions. Here you learn to reason about atoms, bonds, amounts and reaction conditions.',
 'biology':'Biology studies living things and how life works, from cells to ecosystems. Here you learn how organisms use energy, inherit information, change across generations and depend on their surroundings.',
 'earth-science':'Earth science studies our planet: its rocks, land, water and atmosphere, and how they change over time. Here you learn to connect processes such as plate movement, erosion and the water cycle.',
 'astronomy':'Astronomy studies objects and processes beyond Earth, including planets, stars, galaxies and the universe. Here you learn how gravity and evidence carried by light help us understand distant places.',
 'algebra':'Algebra uses symbols to describe quantities and relationships, and to find unknown values. Here you learn how to build simple equations, keep them balanced and interpret what an answer means.',
 'calculus':'Calculus studies continuous change and accumulation: how fast something changes, and how small changes add up. Here you learn the basic meanings of limits, derivatives and integrals through motion and flow.',
 'statistics':'Statistics studies how to collect, summarise and interpret data while accounting for uncertainty. Here you learn to compare typical values and variation, judge samples and avoid confusing association with causation.',
 'data-science':'Data science uses data, computing and statistical reasoning to answer questions and support decisions. Here you learn the basic path from a useful question to clean data, a tested prediction and responsible interpretation.',
 'computer-science':'Computer science studies how information can be represented and processed using precise procedures. Here you learn about algorithms, data organisation, useful simplifications and the limits of computational methods.',
 'artificial-intelligence':'Artificial intelligence studies and builds computer systems for tasks such as recognising patterns, making predictions and generating language. Here you learn how learning from data works at a basic level, how systems are evaluated and why their outputs need judgment.',
 'software-development':'Software development turns user needs into programs that can be tested, used and maintained. Here you learn how requirements, design, coding, testing and revision fit together to produce reliable software.',
 'civil-engineering':'Civil engineering designs and maintains infrastructure such as buildings, bridges, roads and water systems. Here you learn how loads, materials, ground conditions and water affect design; professional design and construction require further training and local standards.',
 'mechanical-engineering':'Mechanical engineering designs machines and physical systems that use forces, motion, heat and energy. Here you learn to reason about handles, motors and moving parts, including efficiency, wear and design trade-offs.',
 'electrical-engineering':'Electrical engineering studies and designs systems using electricity, electronics and signals. Here you learn the meanings of voltage, current, resistance and power using simple paper circuit examples, rather than practical electrical installation.',
 'medicine':'Medicine studies health, illness and ways to prevent, identify and treat disease. Here you learn how symptoms, tests, evidence and individual circumstances inform clinical reasoning; the lesson does not train you to diagnose or treat someone.',
 'nursing':'Nursing supports people’s health through assessment, care planning, practical care, communication and evaluation. Here you learn how observations become coordinated, person-centred care within a trained professional’s role.',
 'pharmacy':'Pharmacy studies medicines and their safe, effective use, including how drugs affect the body and how the body handles them. Here you learn the ideas behind doses, routes, interactions and monitoring, without choosing personal treatments.',
 'nutrition':'Nutrition studies how food and nutrients support body functions and health. Here you learn to interpret food patterns and simple labels, understand differing needs and assess dietary claims without assuming one diet suits everyone.',
 'public-health':'Public health studies and improves health across populations through prevention, safer conditions and organised services. Here you learn to interpret disease rates, compare interventions and consider who can access their benefits.',
 'psychology':'Psychology scientifically studies behaviour and mental processes such as thinking, memory, emotion and learning. Here you learn how several influences shape behaviour and how evidence can test explanations; clinical assessment is beyond this introduction.',
 'accounting':'Accounting records, organises and reports an organisation’s financial activity. Here you learn how transactions affect assets, obligations, ownership and profit, and why a cash movement is not always income or an expense.',
 'finance':'Finance studies how people and organisations obtain, use and manage money over time under uncertainty. Here you learn about interest, compounding, risk, return and access to cash through simplified educational examples.',
 'management':'Management coordinates people and resources to achieve shared goals. Here you learn how planning, responsibilities, communication, incentives and feedback help a team turn limited resources into useful results.',
 'marketing':'Marketing studies customers’ needs and how organisations create, communicate and deliver value. Here you learn how audiences, positioning, channels and evidence guide decisions, extending well beyond advertising.',
 'economics':'Economics studies how people and societies allocate limited resources and respond to incentives. Here you learn to analyse choices, opportunity costs, markets and effects on others using models whose assumptions matter.',
 'entrepreneurship':'Entrepreneurship develops new ventures by finding problems worth solving and testing ways to create sustainable value. Here you learn to examine customer demand, business assumptions, costs and cash before committing more resources.',
 'sociology':'Sociology studies social relationships, groups and institutions, and the patterns they create. Here you learn how norms, opportunities, inequality and personal action interact, and how research investigates those relationships.',
 'political-science':'Political science studies power, government, institutions and collective decision-making. Here you learn how rules shape participation and policy, and how to distinguish evidence about outcomes from judgments about what is fair.',
 'anthropology':'Anthropology studies humans across cultures and time, including social life, human biology and material evidence of the past. This introduction focuses on understanding cultural practices in context through observation, comparison and ethical inquiry.',
 'law':'Law studies the rules recognised and enforced by legal systems, how they are interpreted and how disputes are resolved. Here you learn a basic method for relating sources, facts, jurisdiction and procedure; the lesson does not determine rights in a real case.',
 'international-relations':'International relations studies interactions across borders among states, organisations and other actors. Here you learn to analyse cooperation, conflict, diplomacy and shared problems using several explanatory perspectives.',
 'history':'History investigates the human past through evidence and reasoned interpretation. Here you learn to question sources, establish context and chronology, and compare explanations for change rather than simply memorising dates.',
 'philosophy':'Philosophy examines fundamental questions about knowledge, reality, reasoning and how we ought to live. Here you learn to clarify concepts, analyse arguments and test claims while recognising that many questions remain debated.',
 'religion':'The study of religion examines beliefs, practices, texts, communities and their histories. Here you learn to compare perspectives respectfully and distinguish participants’ faith commitments from historical or empirical claims, without assuming one tradition represents all religion.',
 'literature':'Literature studies imaginative and expressive writing, including stories, poetry and drama. Here you learn how wording, form, voice and context create meaning, and how to support an interpretation with details from a text.',
 'languages':'Language learning develops the ability to understand and communicate in a language through listening, speaking, reading or writing as appropriate. Here you learn how meaning, grammar, pronunciation, context and practice work together; this is a guide to learning rather than a course in one specific language.',
 'linguistics':'Linguistics studies how human language works, including speech and sign, word structure, sentences, meaning and variation. Here you learn to identify language patterns and distinguish describing real usage from prescribing a preferred standard.',
 'visual-arts':'Visual arts explores making and interpreting works such as drawing, painting and sculpture. Here you learn how observation, composition, materials and context influence what an artwork communicates and how it is experienced.',
 'music':'Music studies and practises organising sound through time, including rhythm, pitch, texture and expression. Here you learn to distinguish basic musical elements and recognise that musical systems and conventions vary across traditions.',
 'architecture':'Architecture designs buildings and spaces for human use and experience. Here you learn how purpose, movement, structure, climate, access and place interact, with simple drawing concepts rather than a complete building design.',
 'graphic-design':'Graphic design arranges text and visual elements to communicate a message to an audience. Here you learn how hierarchy, typography, contrast, alignment and spacing help people find and understand information.',
 'ux-design':'UX design, or user experience design, studies and improves how people experience a product or service. Here you learn to connect user needs with clear tasks, navigation, feedback, accessibility and practical usability testing.',
 'film':'Film studies and creates meaning through moving images, sound, performance and editing. Here you learn how framing, shot order, duration and audio shape a story and influence the viewer’s interpretation.',
 'teaching-methods':'Teaching methods studies ways to help people understand, practise and apply new knowledge or skills. Here you learn how prior knowledge, clear explanations, manageable practice and useful feedback support learning.',
 'curriculum-design':'Curriculum design plans what people should learn, in what order, and how learning will be supported and assessed. Here you learn to connect goals, content, activities and assessment into a coherent learning sequence.',
 'child-development':'Child development studies how children’s physical abilities, thinking, language, emotions and relationships change over time. Here you learn how these areas interact and why individual variation and context matter, without using milestones as a diagnosis.',
 'climate-science':'Climate science studies long-term weather patterns and the processes that influence them. Here you learn how energy balance, greenhouse gases, natural variability and feedbacks connect to observations and explanations of climate change.',
 'sustainability':'Sustainability examines how human activities can support wellbeing while respecting environmental limits and future needs. Here you learn to compare resource use, lifecycle effects and fairness, making boundaries and trade-offs explicit.',
 'farming':'Farming grows crops and manages agricultural resources to produce food and other useful products. This introduction focuses on crop production: how soil, water, growth conditions, pest management and records shape outcomes; animal production has a separate lesson.',
 'animal-science':'Animal science studies animal biology and its application to care, nutrition, health, welfare and production. Here you learn to connect animals’ needs with management and basic performance records while keeping welfare and species differences in view.',
 'trades':'Trades are skilled practical occupations such as carpentry, plumbing and fabrication. Here you learn shared foundations in planning, measurement, materials, tool selection and quality checks; hands-on competence requires trade-specific training and safety instruction.',
 'hospitality':'Hospitality organises services and experiences for guests, including accommodation, food service and events. Here you learn how guest needs, capacity, communication, hygiene and problem resolution fit together in daily operations.',
 'logistics':'Logistics plans and coordinates the movement and storage of goods and the information that accompanies them. Here you learn how demand, stock levels, replenishment time, transport and warehouse accuracy affect reliable delivery.',
 'project-management':'Project management organises temporary work to deliver an agreed result. Here you learn how scope, task dependencies, resources, risks and acceptance criteria help a team plan work and establish when it is done.'
};

function resourceHTML(l){let keys=[];if(['science','math','business'].includes(l.area)||['psychology','sociology','political-science','anthropology'].includes(l.id))keys.push('openstax');if(l.id==='software-development')keys.push('mdn');if(l.id==='history')keys.push('history');return keys.length?'<h3>Optional online learning resources</h3><ul>'+keys.map(k=>{const r=resources[k];return '<li><a href="'+esc(r[1])+'" target="_blank" rel="noopener noreferrer">'+esc(r[0])+' <span class="muted">(online, new tab)</span></a> — '+esc(r[2])+'</li>';}).join('')+'</ul><p><small>Destination links checked 26 October 2026. Availability and course details can change. External resources are not included in this offline file.</small></p>':'';}
function renderLesson(id){const l=byId[id];if(!l)return missing();const group=lessons.filter(x=>x.area===l.area),idx=group.indexOf(l);const learn=state.learned.includes(id),save=state.bookmarks.includes(id);
 let html='<div class="lesson"><nav class="crumbs" aria-label="Breadcrumb"><a href="#home">All subjects</a><span aria-hidden="true">/</span><a href="#area/'+l.area+'">'+esc(areaName(l.area))+'</a><span aria-hidden="true">/</span><span>'+esc(l.title)+'</span></nav><p><a class="back" href="#home">← Back to all subjects</a></p><div class="actions" aria-label="Learning controls"><button type="button" data-toggle="learned" data-id="'+id+'" aria-pressed="'+learn+'">'+(learn?'Learned ✓ — undo':'Mark as learned')+'</button><button type="button" data-toggle="bookmarks" data-id="'+id+'" aria-pressed="'+save+'">'+(save?'Bookmarked ✓ — remove':'Bookmark lesson')+'</button><button type="button" data-action="expand">Expand sections C–G</button><button type="button" data-action="collapse">Collapse sections C–G</button><button type="button" data-action="print">Print lesson</button></div><nav class="subnav" aria-label="Lesson sections">'+sectionNames.map((n,i)=>'<a href="#lesson/'+id+'/'+sectionIDs[i]+'">'+n+'</a>').join('')+'</nav><article><h1>'+esc(l.title)+'</h1><section class="subject-intro" aria-labelledby="intro-heading"><h2 id="intro-heading">What this subject teaches</h2><p>'+esc(l.intro)+'</p></section><section id="map"><h2>A. Visual mind map</h2>'+mapHTML(l)+'</section>';
 html+='<section class="section" id="principles"><h2>B. Fundamental principles</h2><p class="muted">Read these as foundations within the scope stated: physical principles, tested findings, useful models, professional conventions or interpretive methods as appropriate.</p><ul>'+l.principles.map(([n,t],i)=>'<li id="foundation-'+i+'"><strong>'+esc(n)+'.</strong> '+esc(t)+'</li>').join('')+'</ul><nav class="subnav" aria-label="Foundation subtopics">'+l.principles.map(([n],i)=>'<a href="#lesson/'+id+'/foundation-'+i+'">'+esc(n)+'</a>').join('')+'</nav></section>';
 html+=section(2,'<dl>'+l.vocab.map(([n,t])=>'<dt>'+esc(n)+'</dt><dd>'+esc(t)+'</dd>').join('')+'</dl>');
 html+=section(3,'<div class="example"><h3>A step-by-step application</h3><ol>'+l.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol></div>');
 html+=section(4,l.mistakes.map(([n,t])=>'<h3>'+esc(n)+'</h3><p>'+esc(t)+'</p>').join(''));
 html+=section(5,'<p>Try answering in your own words first. Open each control to compare your reasoning.</p>'+l.quiz.map(([q,a],i)=>'<div class="answer"><h3>'+(i+1)+'. '+esc(q)+'</h3><details class="reveal"><summary aria-label="Show answer to question '+(i+1)+'">Show answer</summary><p>'+esc(a)+'</p></details></div>').join(''));
 html+=section(6,'<h3>Prerequisites</h3><p>'+esc(l.pre)+'</p><h3>A sensible next topic</h3><p>'+esc(l.next)+'</p><p class="muted">Suggested direction for further study. Dedicated advanced lessons are planned; the related foundations below are available now.</p><h3>Connections to available subjects</h3><ul>'+l.related.map(([rid,why])=>'<li><a href="'+lessonURL(rid)+'">'+esc(byId[rid].title)+'</a> — '+esc(why)+'</li>').join('')+'</ul>'+resourceHTML(l));
 html+='</article><nav class="pager" aria-label="Previous and next subjects in '+esc(areaName(l.area))+'">'+(idx>0?'<a class="button" rel="prev" href="'+lessonURL(group[idx-1].id)+'">← Previous: '+esc(group[idx-1].title)+'</a>':'<span class="muted">First in this area</span>')+(idx<group.length-1?'<a class="button" rel="next" href="'+lessonURL(group[idx+1].id)+'">Next: '+esc(group[idx+1].title)+' →</a>':'<span class="muted">Last in this area</span>')+'</nav><p><a class="button back" href="#home">Back to all subjects</a></p><p id="lesson-status" role="status" aria-live="polite"></p></div>';return html;
}
function missing(){return '<h1>Page not found</h1><p>This subject or area is not in the current catalogue.</p><a class="button" href="#home">Back to all subjects</a>';}
const searchIndex=new Map(lessons.map(l=>[l.id,JSON.stringify(l).toLowerCase()]));
function searchPage(query='',library=false){return '<nav class="crumbs" aria-label="Breadcrumb"><a href="#home">All subjects</a><span aria-hidden="true">/</span><span>'+(library?'My learning':'Search')+'</span></nav><h1>'+(library?'Your learning shelf':'Find a subject or idea')+'</h1><p>'+(library?'Your bookmarks and learned lessons are stored in this browser. Use the status filter to explore them.':'Search subject names, vocabulary, examples, principles, questions and answers. All 55 lessons are indexed offline.')+'</p><section class="panel search-panel"><form id="search-form" role="search"><div class="tools"><div class="field"><label for="query">Search all lesson content</label><input id="query" type="search" placeholder="Try energy, evidence or budget" value="'+esc(query)+'"></div><div class="field"><label for="area-filter">Learning area</label><select id="area-filter"><option value="">All learning areas</option>'+areas.map(([id,n])=>'<option value="'+id+'">'+esc(n)+'</option>').join('')+'</select></div><div class="field"><label for="saved-filter">Saved status</label><select id="saved-filter"><option value="'+(library?'saved':'all')+'">'+(library?'Bookmarked or learned':'All available lessons')+'</option>'+(library?'<option value="all">All available lessons</option>':'<option value="saved">Bookmarked or learned</option>')+'<option value="bookmarks">Bookmarked</option><option value="learned">Learned</option><option value="unlearned">Not marked learned</option></select></div><button type="submit">Search</button><button type="button" data-action="clear">Clear filters</button></div></form></section><p id="result-count" role="status" aria-live="polite"></p><section id="results" aria-label="Matching lessons"></section><p><a class="button" href="#home">Back to all subjects</a></p>';}
function filterResults(){const input=document.querySelector('#query');if(!input)return;const query=input.value.trim().toLowerCase(),tokens=query.split(/\s+/).filter(Boolean),area=document.querySelector('#area-filter').value,saved=document.querySelector('#saved-filter').value;const matches=lessons.filter(l=>(!area||l.area===area)&&tokens.every(t=>searchIndex.get(l.id).includes(t))&&(saved==='all'||saved==='saved'&&(state.learned.includes(l.id)||state.bookmarks.includes(l.id))||saved==='bookmarks'&&state.bookmarks.includes(l.id)||saved==='learned'&&state.learned.includes(l.id)||saved==='unlearned'&&!state.learned.includes(l.id)));document.querySelector('#result-count').textContent=matches.length+' matching '+(matches.length===1?'lesson':'lessons');document.querySelector('#results').innerHTML=resultsHTML(matches,query);}
let activeLesson=null;
function route(){const raw=location.hash.slice(1)||'home';let parts;try{parts=raw.split('/').map(decodeURIComponent);}catch{parts=['invalid'];}const [kind,id,sectionId]=parts;activeLesson=kind==='lesson'?id:null;main.innerHTML=kind==='home'?home():kind==='area'?renderArea(id):kind==='lesson'?renderLesson(id):kind==='search'||kind==='library'?searchPage(id||'',kind==='library'):missing();document.title=(byId[activeLesson]?.title|| (kind==='home'?'Explore':kind==='library'?'My learning':kind==='search'?'Search':areaName(id)))+' | Foundations of Knowledge';if(kind==='search'||kind==='library'){filterResults();document.querySelector('#query').addEventListener('input',filterResults);document.querySelector('#area-filter').addEventListener('change',filterResults);document.querySelector('#saved-filter').addEventListener('change',filterResults);document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();filterResults();document.querySelector('#result-count').focus();});document.querySelector('#result-count').tabIndex=-1;}updateCount();if(sectionId){const target=document.getElementById(sectionId);if(target){if(target.tagName==='DETAILS')target.open=true;requestAnimationFrame(()=>{target.scrollIntoView();target.tabIndex=-1;target.focus({preventScroll:true});});}}else{window.scrollTo(0,0);main.focus({preventScroll:true});}}
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.toggle){const key=b.dataset.toggle,id=b.dataset.id,was=state[key].includes(id);state[key]=was?state[key].filter(x=>x!==id):[...state[key],id];persist();b.setAttribute('aria-pressed',String(!was));b.textContent=key==='learned'?(!was?'Learned ✓ — undo':'Mark as learned'):(!was?'Bookmarked ✓ — remove':'Bookmark lesson');document.querySelector('#lesson-status').textContent=byId[id].title+(key==='learned'?(!was?' marked as learned.':' no longer marked as learned.'):(!was?' bookmarked.':' bookmark removed.'))+(storageOK?' Saved in this browser.':' Saved for this session only.');}if(b.dataset.action==='expand'||b.dataset.action==='collapse')main.querySelectorAll('.collapsible').forEach(d=>d.open=b.dataset.action==='expand');if(b.dataset.action==='clear'){document.querySelector('#query').value='';document.querySelector('#area-filter').value='';document.querySelector('#saved-filter').value='all';filterResults();document.querySelector('#query').focus();}if(b.dataset.action==='print')window.print();});
let printState=[];
window.addEventListener('beforeprint',()=>{printState=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printState.forEach(([d])=>d.open=true);});
window.addEventListener('afterprint',()=>printState.forEach(([d,open])=>d.open=open));
window.addEventListener('hashchange',route);storageNotice();route();
</script></body></html>
