<script>
'use strict';
// EXTENDING: add an area [stable ID, name] here; then add a lesson using L below.
const areas=[['science','Natural sciences'],['math','Mathematics & data'],['technology','Technology & engineering'],['health','Health & medicine'],['business','Business & economics'],['social','Social sciences'],['humanities','Humanities'],['arts','Arts & design'],['education','Education'],['environment','Environment & agriculture'],['practical','Practical & vocational']];
const lessons=[];
// Each lesson uses ^ between entries and ~ between label and explanation.
// Fields: area, stable ID, title, five map branches, five principles, vocabulary,
// worked steps, two misconceptions, three question~answer pairs, next topic,
// related subject ID~connection pairs, prerequisites. Keep IDs stable for links.
function L(area,id,title,map,p,v,e,m,q,next,related,pre='No specialist knowledge. Comfortable reading and everyday reasoning are enough.'){
 const pairs=s=>s.split('^').map(x=>x.split('~'));
 lessons.push({area,id,title,map:pairs(map),principles:pairs(p),vocab:pairs(v),steps:e.split('^'),mistakes:pairs(m),quiz:pairs(q),next,related:pairs(related),pre});
}
L('science','physics','Physics',
'Motion~Position and speed^Forces~Pushes and acceleration^Energy~Transfers and storage^Waves~Sound and light^Measurement~Units and uncertainty',
'Inertia~Without a net force, motion stays constant. A rolling cart slows because friction acts.^Net force~Unbalanced forces change velocity. An empty trolley accelerates more easily than a loaded one.^Energy conservation~Energy transfers rather than appearing from nothing. Braking warms bicycle brakes.^Wave transfer~Waves carry energy without carrying material the whole distance. A floating leaf bobs as ripples pass.^Measured uncertainty~Measurements have limits. Recording a shelf as about 80 cm avoids false precision.',
'Force~A push or pull.^Velocity~Speed with direction.^Acceleration~Change in velocity per second.^Energy~Capacity to cause change.^Newton~Unit of force, written N.',
'Model: push a 2 kg cart on a level, nearly frictionless floor.^Let m be mass in kilograms, a acceleration in metres per second squared, and F net force in newtons.^Use F = m × a. If F is 6 N, a = 6 ÷ 2 = 3 m/s².^After 2 seconds from rest, speed is 6 m/s if the force remains constant. Real friction reduces the net force.',
'Moving requires a continuous net force~Constant velocity needs no net force; friction explains familiar slowing.^Mass equals weight~Mass measures inertia; weight is gravitational force and changes with location.',
'Why does a cart slow after a push?~Friction and air resistance exert forces opposing its motion.^What happens if mass doubles at the same net force?~Acceleration halves.^Where does braking energy go?~Mostly into thermal energy in brakes, tyres and surroundings.',
'Explore balanced forces using everyday objects.','algebra~Rearrange force equations.^mechanical-engineering~Apply forces to useful machines.');
L('science','chemistry','Chemistry',
'Atoms~Elements and particles^Bonds~Sharing and transfer^Reactions~Rearranging atoms^Amounts~Mass and ratios^Conditions~Temperature and rate',
'Atomic structure~Elements differ in proton count. Carbon and oxygen behave differently because their atoms differ.^Bonding~Electron interactions hold atoms together. Water contains bonded hydrogen and oxygen.^Conservation of atoms~Ordinary chemical reactions rearrange atoms. Rust includes oxygen from air, explaining added mass.^Fixed proportions~A pure compound has a specific atomic ratio. Water has two hydrogen atoms per oxygen atom.^Rate depends on conditions~Temperature and concentration affect collisions. Food usually spoils faster when warm.',
'Atom~Smallest unit retaining an element’s identity.^Element~Substance with one proton count.^Molecule~Group of bonded atoms.^Reaction~Process changing chemical substances.^Concentration~Amount of substance in a given volume.',
'Imagine water forming from hydrogen and oxygen; this is a paper exercise, not an experiment.^H₂ means two hydrogen atoms; O₂ means two oxygen atoms.^Balance the equation: 2H₂ + O₂ → 2H₂O.^Count each side: four hydrogen atoms and two oxygen atoms. Coefficients count molecules; subscripts describe each molecule.',
'Atoms disappear in reactions~They are rearranged in ordinary chemical reactions.^Natural means harmless~Safety depends on substance, dose and exposure, not origin.',
'Why must reaction equations balance?~Atoms of each element are conserved.^Does changing H₂O to H₂O₂ balance water formation?~No. It changes the substance to hydrogen peroxide.^Why refrigerate food?~Cooling slows many spoilage reactions and microbial processes; it does not stop all of them.',
'Study particle models of solids, liquids and gases.','physics~Energy influences chemical changes.^biology~Cells run networks of chemical reactions.');
L('science','biology','Biology',
'Cells~Living units^Information~DNA and inheritance^Energy~Metabolism^Evolution~Variation and selection^Systems~Organisms and ecosystems',
'Cell theory~Organisms consist of cells. A cut heals through cell activity and division.^Information inheritance~DNA carries instructions passed between generations. Related plants may share leaf traits.^Energy transformation~Life needs energy and matter. Plants capture light but also need water and minerals.^Evolution~Heritable variation and differential reproduction change populations. Resistant bacteria become more common under antibiotic selection.^Interdependence~Living systems exchange resources. Pollinators help plants reproduce while obtaining food.',
'Cell~Basic living unit.^DNA~Molecule carrying inherited information.^Gene~DNA region contributing to a functional product.^Metabolism~Chemical processes supporting life.^Ecosystem~Organisms interacting with their environment.',
'Consider a simplified bacterial population: 99 susceptible bacteria and one resistant bacterium.^An antibiotic kills susceptible bacteria more effectively.^The resistant bacterium survives and reproduces, increasing the resistant fraction.^The drug did not teach bacteria to resist. Pre-existing variation and selection changed the population; real resistance can also spread through gene transfer.',
'Individuals evolve because they need to~Population traits change across generations; need alone does not create useful mutations.^Plants get most mass from soil~Much plant dry mass comes from carbon dioxide fixed during photosynthesis.',
'What is the basic living unit?~A cell.^Why can resistance become common?~Resistant organisms survive and reproduce more successfully under selection.^How do plants connect to atmospheric carbon?~They use carbon dioxide to build organic molecules.',
'Study cell membranes and photosynthesis.','chemistry~Explains molecules and reactions in cells.^animal-science~Applies biology to animal care.');
L('science','earth-science','Earth science',
'Rocks~Minerals and cycles^Plates~Movement and boundaries^Water~Storage and flow^Atmosphere~Weather processes^Deep time~Evidence and change',
'Plate tectonics~Moving surface plates explain many earthquakes and mountains. Collision can uplift rock.^Rock cycling~Rocks change through heat, pressure and erosion. Sand can become sandstone.^Water conservation~Water moves among reservoirs. Rain can run into rivers or enter soil.^Uneven heating~Solar heating drives air and water movement. Coastal breezes reflect temperature differences.^Deep time~Small processes accumulate over long periods. A river can carve a valley over many generations.',
'Mineral~Naturally occurring crystalline solid.^Plate~Moving section of Earth’s outer shell.^Erosion~Removal and transport of material.^Aquifer~Permeable material storing groundwater.^Weathering~Breakdown of rock in place.',
'Track a hypothetical 100 litres of rain on a small plot.^Assume 30 L runs off, 50 L enters the soil and 20 L returns to air.^Check the balance: 30 + 50 + 20 = 100 L.^Water entering soil may later feed plants or groundwater. This simplified snapshot ignores earlier stored water.',
'Weathering and erosion are identical~Weathering breaks material down; erosion transports it.^Continents never change~Their motion is slow on human timescales but measurable.',
'What transports broken rock?~Erosion.^Where can infiltrated rain go?~Into soil storage, plants or deeper groundwater.^Why are many earthquakes near plate boundaries?~Plate movement builds and releases stress there.',
'Compare igneous, sedimentary and metamorphic rocks.','climate-science~Links air, oceans and long-term change.^civil-engineering~Ground and water conditions influence structures.');
L('science','astronomy','Astronomy',
'Gravity~Orbits and attraction^Light~Spectra and distance^Stars~Fusion and lifecycles^Planets~Worlds and systems^Universe~Expansion and evidence',
'Gravitation~Masses attract. Earth’s gravity bends the Moon’s path into an orbit.^Finite light speed~Looking farther means seeing earlier. Sunlight reaches Earth after about eight minutes.^Spectral evidence~Light patterns reveal composition and motion. Hydrogen lines identify hydrogen in a star.^Stellar evolution~Stars change as their fuel and structure change. The Sun will not remain in its current state forever.^Model testing~Cosmic models must fit observations. Expansion models explain systematic shifts in distant galaxy light.',
'Orbit~Path shaped by gravity.^Light-year~Distance light travels in one year.^Spectrum~Light separated by wavelength.^Fusion~Combining light nuclei with energy release.^Galaxy~Large gravitationally bound system of stars, gas and other matter.',
'Suppose a star is 10 light-years away.^A light-year measures distance, not age.^Its light takes about 10 years to reach us, so we observe it as it was 10 years ago.^A message travelling at light speed would take at least another 10 years to reach that star from Earth, ignoring relative motion.',
'A light-year is a time unit~It is a distance.^Seasons come mainly from distance to the Sun~Earth’s axial tilt changes sunlight angle and day length.',
'What holds planets in orbit?~Gravity continuously changes their direction.^What does a spectrum reveal?~Clues about composition, temperature and motion.^Why is a distant galaxy a view into the past?~Its light has travelled for a long time.',
'Observe Moon phases and explain their geometry.','physics~Provides gravity and light models.^statistics~Helps distinguish faint signals from noise.');
L('math','algebra','Algebra',
'Symbols~Unknowns and quantities^Equality~Balanced operations^Expressions~Combining terms^Functions~Input and output^Models~Relationships and limits',
'Equality is balance~Both sides represent the same value. Adding 3 to each side preserves an equation.^Inverse operations~Undo operations in reverse order. Division undoes multiplication when the divisor is nonzero.^Structure matters~Grouping changes calculations. Two groups of five differ from two plus five.^Variables represent quantities~A letter stands for a defined value. Letting c mean cost keeps a budget model clear.^Models have domains~A formula applies under stated assumptions. A taxi price rule may stop applying outside a service area.',
'Variable~Symbol representing a quantity.^Expression~Combination of numbers and operations.^Equation~Statement that expressions are equal.^Coefficient~Number multiplying a variable.^Function~Rule assigning one output to each allowed input.',
'A taxi charges 4 currency units plus 2 per kilometre. Let d be distance in km and C cost.^The simplified model is C = 4 + 2d.^For C = 18, subtract 4 from both sides: 14 = 2d.^Divide both sides by 2: d = 7 km. Check: 4 + 2 × 7 = 18.',
'The equals sign means “calculate next”~It states equal values, so every step must preserve equality.^A variable always means x~Any clearly defined symbol can represent a quantity.',
'Solve x + 5 = 12.~Subtract 5 from both sides: x = 7.^In C = 4 + 2d, what does 4 represent?~The fixed starting charge.^Can you divide both sides by zero?~No. Division by zero is undefined.',
'Study linear graphs and slopes.','calculus~Studies changing functions.^accounting~Uses equations to reconcile balances.','Basic arithmetic, including multiplication and division.');
L('math','calculus','Calculus',
'Functions~Changing quantities^Limits~Approaching a value^Derivatives~Instantaneous rates^Integrals~Accumulated change^Models~Assumptions and units',
'Limits describe approach~Values near a point can reveal a trend. Smaller time intervals help estimate instantaneous speed.^Derivatives measure local change~A derivative gives the rate at a point. A distance graph’s slope gives velocity.^Integrals accumulate~Small contributions combine into totals. Adding flow over time gives water volume.^Rates and totals connect~Under suitable conditions, integration reverses differentiation. Constant speed accumulates distance steadily.^Units guide meaning~A rate carries divided units. Litres per minute times minutes gives litres.',
'Limit~Value approached as an input approaches something.^Derivative~Instantaneous rate of change.^Integral~Accumulated quantity over an interval.^Slope~Output change divided by input change.^Continuous~Having no break at the point considered.',
'Let t be time in seconds and s distance in metres. Suppose s = t² for t ≥ 0.^Average speed from t = 2 to t = 3 is (9 − 4) ÷ (3 − 2) = 5 m/s.^For this function, the derivative is v = 2t, where v is instantaneous velocity.^At t = 2, v = 4 m/s. The average over a whole second differs because velocity is increasing.',
'A derivative is always an average~It describes the limiting local rate.^An integral is just area in square metres~Its units depend on the quantities; flow over time gives volume.',
'What does the derivative of distance represent?~Velocity.^At t = 3 in v = 2t, what is velocity?~6 m/s.^A tap flows at 2 L/min for 5 min. Total?~10 L, assuming constant flow.',
'Explore slopes of tangent lines.','algebra~Defines and rearranges functions.^physics~Connects position, velocity and acceleration.','Algebra, graph coordinates and basic function notation.');
L('math','statistics','Statistics',
'Data~Samples and populations^Description~Centre and spread^Probability~Uncertainty^Inference~Evidence from samples^Design~Bias and confounding',
'Variation is information~Values differ for reasons worth studying. Average delivery time alone hides unreliable deliveries.^Samples need representation~Selection affects conclusions. Surveying only daytime shoppers misses some workers.^Association is not causation~Linked changes can have other explanations. Hot weather raises both ice-cream sales and swimming.^Uncertainty belongs in conclusions~Sample results vary. An estimated percentage is not an exact population fact.^Study design matters~Comparisons need fair conditions. Random assignment can help separate treatment effects from confounding.',
'Population~Whole group of interest.^Sample~Subset observed.^Mean~Sum divided by count.^Median~Middle ordered value.^Confounder~Factor influencing both an apparent cause and outcome.',
'Three deliveries take 2, 3 and 10 days.^Mean = (2 + 3 + 10) ÷ 3 = 5 days.^The ordered middle value, the median, is 3 days.^The range is 10 − 2 = 8 days. Report centre and spread; these three observations may not represent all deliveries.',
'A large sample eliminates bias~Biased selection can remain even with many observations.^Averages describe everyone~An average can hide important differences and extreme values.',
'What is the median of 1, 4, 12?~4.^Why might customer volunteers be unrepresentative?~People choosing to respond may differ from others.^Does a correlation prove a cause?~No; confounding or reverse causation may explain it.',
'Learn sampling methods and probability distributions.','data-science~Uses inference to evaluate patterns.^public-health~Uses population data to assess interventions.','Basic arithmetic and percentages.');
L('math','data-science','Data science',
'Questions~Decisions and targets^Data~Collection and cleaning^Exploration~Patterns and anomalies^Models~Prediction and validation^Responsibility~Privacy and bias',
'Start with a decision~A useful question guides analysis. Predicting stock shortages helps plan orders.^Data has provenance~Where data comes from affects meaning. A returned item may be recorded as negative sales.^Validation needs separation~Test on data not used to fit the model. Future-week sales better assess forecasting than reused training rows.^Leakage misleads~Using unavailable information inflates results. Tomorrow’s sales cannot predict tomorrow’s sales in advance.^Responsible use~Privacy and unequal errors affect people. A hiring model must be examined for harmful patterns.',
'Dataset~Organised collection of observations.^Feature~Input used by a model.^Target~Outcome to predict.^Training~Fitting a model using examples.^Validation~Checking performance on separate evidence.',
'A shop wants tomorrow’s bread order.^Use earlier daily sales, marking closures and missing records.^Fit a simple baseline: predict the average of recent comparable days.^Check it on later days withheld from fitting. Compare predicted and actual sales; shortages and waste may have different costs.',
'More data always means better answers~Irrelevant or inaccurate data can make answers worse.^High training accuracy proves usefulness~A model may memorise examples and fail on new cases.',
'What is the target in a sales forecast?~The future sales quantity.^Why keep later days separate?~To test performance on unseen conditions.^Why mark a closed day?~Zero sales from closure differ from zero customer demand.',
'Compare a simple baseline with one predictive model.','statistics~Quantifies variation and uncertainty.^artificial-intelligence~Builds systems that learn patterns.','Basic statistics and comfort with tables.');
L('technology','computer-science','Computer science',
'Algorithms~Steps and decisions^Data~Representation^Abstraction~Useful simplification^Computation~Resources and limits^Systems~Interacting components',
'Algorithms need precision~Instructions must specify actions and stopping conditions. A search procedure must handle a missing item.^Representation shapes operations~Data encoding affects what is easy. Sorted names support faster lookup.^Abstraction hides detail~A useful interface exposes necessary behaviour. A file can be opened without understanding disk electronics.^Efficiency depends on scale~Work grows with input size. Comparing every pair becomes expensive in a large list.^Correctness needs edge cases~Ordinary examples are insufficient. A sorting routine must handle an empty list.',
'Algorithm~Finite, explicit procedure.^Bit~Binary digit, 0 or 1.^Abstraction~Model hiding selected detail.^Data structure~Way of organising data.^Complexity~How resource use grows with input size.',
'Find 7 in the sorted list 2, 5, 7, 9, 12.^Inspect the middle value: 7. The search succeeds after one comparison.^If searching for 8 instead, discard values through 7, then inspect the remaining interval.^This binary-search method repeatedly halves the candidates. It requires sorted data and must stop when no candidates remain.',
'Computers understand intentions~They execute specified operations, including mistaken ones.^Faster hardware fixes every slow method~Poorly scaling algorithms can overwhelm faster hardware.',
'Why must binary search use sorted data?~Order tells us which half can be discarded.^What is an edge case for a list?~An empty list or one-item list.^Why use abstraction?~It reduces the detail needed to reason about a task.',
'Write precise search and sorting procedures.','algebra~Supports logical models.^software-development~Turns algorithms into maintained programs.');
L('technology','artificial-intelligence','Artificial intelligence',
'Goals~Tasks and success^Learning~Patterns from data^Models~Representations^Evaluation~Errors and generalisation^Oversight~People and consequences',
'Performance is task-specific~A model’s success depends on the test. Recognising cats does not demonstrate medical expertise.^Learning reflects examples~Training data shapes behaviour. Underrepresented accents can cause speech-recognition errors.^Prediction is not certainty~Outputs can be wrong despite confident wording. A generated citation needs independent checking.^Generalisation must be tested~New cases differ from training cases. Test a crop detector in another season.^Human accountability~People decide acceptable use and safeguards. A consequential decision needs review and a route to challenge errors.',
'Model~System representing learned or specified relationships.^Machine learning~Methods fitting patterns from data.^Training data~Examples used to fit a model.^Inference~Using a trained model to produce an output.^Bias~Systematic skew in data, methods or outcomes.',
'A toy spam filter learns from messages labelled spam or legitimate.^Set aside 100 new messages before training.^Suppose it wrongly blocks 3 legitimate messages and misses 5 spam messages.^Review both error types separately. Blocking an urgent real message may cost more than letting one advert through; one score cannot capture every consequence.',
'Fluent output proves understanding and truth~Fluency does not verify factual accuracy.^A model is neutral because it uses numbers~Choices about labels, data and objectives embed priorities.',
'Why check generated references?~The system may produce plausible but nonexistent sources.^What should a spam test separate?~Wrongly blocked real messages and missed spam.^Why test a crop model in another season?~Lighting, growth stages and disease patterns may change.',
'Compare supervised learning with rule-based systems.','data-science~Provides data preparation and validation.^philosophy~Examines responsibility and knowledge.');
L('technology','software-development','Software development',
'Requirements~User needs^Design~Parts and interfaces^Implementation~Code and data^Verification~Tests and review^Maintenance~Change and reliability',
'Requirements guide choices~Define the user’s task before coding. An offline checklist needs local access.^Separation of concerns~Give components clear jobs. Separate price calculations from screen layout.^Feedback reduces mistakes~Small tested changes reveal errors early. Check one form field before adding ten.^Versioning preserves history~Recorded revisions make changes traceable. Restore a working calculation after a faulty edit.^Security needs boundaries~Treat untrusted input carefully. Display typed text as text rather than executing it.',
'Requirement~Behaviour or constraint the software must meet.^Interface~Boundary through which parts interact.^Test~Check comparing actual with expected behaviour.^Version control~System tracking changes over time.^Bug~Defect causing unintended behaviour.',
'Build a shopping-total function: quantity times unit price.^Specify quantity as a nonnegative whole number and price in currency subunits, such as cents.^For 3 items at 250 cents, expect 750 cents. Also test zero items and invalid negative input.^Display 7.50 only at the interface. Real financial software needs explicit currency and rounding rules.',
'Working once means finished~Changes, unusual inputs and environments can reveal defects.^Tests prove no bugs exist~Tests cover selected cases, not every possible execution.',
'Why define valid inputs?~So behaviour at boundaries is clear and testable.^Why use version control?~To inspect, compare and recover changes.^What should a zero-quantity test return?~Zero cost under this requirement.',
'Learn semantic HTML, then forms and input validation.','computer-science~Provides algorithms and data structures.^ux-design~Defines understandable user interactions.');
L('technology','civil-engineering','Civil engineering',
'Loads~Forces and paths^Materials~Strength and durability^Ground~Soil and foundations^Water~Flow and drainage^Public safety~Standards and uncertainty',
'Loads need a path~Forces must reach supporting ground. A roof transfers weight through beams and columns.^Equilibrium matters~A stable resting structure balances forces and moments. Uneven support can make a shelf rotate.^Materials have limits~Strength and stiffness differ. A beam may bend too much before breaking.^Ground is part of the system~Soil behaviour influences safety. Soft ground can settle beneath a foundation.^Design manages uncertainty~Professional codes specify checks and margins. Bridge design considers more than a single expected vehicle.',
'Load~Force acting on a structure.^Stress~Force per unit area.^Foundation~Part transferring loads to ground.^Settlement~Downward ground or foundation movement.^Drainage~Controlled removal or routing of water.',
'Paper model only: a beam has two end supports and a centred 100 N downward load.^Assume a rigid, symmetric beam and ignore its own weight.^Vertical balance requires upward reactions totalling 100 N.^Symmetry gives 50 N at each end. Real design also checks bending, material behaviour, connections, loads and local codes.',
'Strong material guarantees a safe building~Geometry, connections, ground and loading also matter.^A safety margin replaces calculations~Margins supplement a sound design and required checks.',
'Where must a building’s loads ultimately go?~Through its structure and foundations into the ground.^In the symmetric example, each reaction?~50 N upward.^Why examine soil?~Ground movement can damage even strong structures.',
'Study force diagrams and load paths; construction requires qualified local professionals.','physics~Explains equilibrium.^earth-science~Explains rocks, groundwater and soils.');
L('technology','mechanical-engineering','Mechanical engineering',
'Mechanics~Forces and motion^Energy~Heat and work^Materials~Strength and wear^Mechanisms~Motion transfer^Design~Testing and constraints',
'Energy accounting~Machines transform energy with losses. A motor heats up while doing useful work.^Leverage trades motion for force~Mechanical advantage does not create energy. A long handle needs less force but travels farther.^Heat flows with temperature difference~Thermal design controls transfer. Cooling fins help a motor release heat.^Materials fatigue~Repeated loads can cause damage below one-time strength. A bending wire may eventually crack.^Design is compromise~Cost, reliability and performance interact. A lighter part may be more expensive to manufacture.',
'Torque~Turning effect of force.^Work~Energy transferred by force through distance.^Power~Energy transferred per unit time.^Efficiency~Useful output divided by input.^Fatigue~Damage accumulating under repeated loading.',
'A perpendicular 20 N force acts on a 0.3 m handle.^Let τ denote torque, F force and r perpendicular lever arm.^Use τ = F × r: 20 × 0.3 = 6 N·m.^A 0.6 m handle needs 10 N for the same torque. This ideal calculation ignores friction and safety limits; it is not tool-use advice.',
'More force always means more power~Power also depends on motion rate.^A machine can be perfectly efficient in practice~Real machines dissipate some energy, often as heat.',
'What happens if handle length doubles at the same force?~Torque doubles when the force stays perpendicular.^Where does lost useful energy go?~Into other forms such as heat and sound.^Why test repeated loading?~To investigate fatigue and durability.',
'Explore gears and energy efficiency.','physics~Supplies motion and energy principles.^chemistry~Explains material composition and corrosion.');
L('technology','electrical-engineering','Electrical engineering',
'Charge~Current and flow^Circuits~Paths and voltage^Components~Resistance and storage^Signals~Information in variation^Safety~Isolation and limits',
'Charge is conserved~Current accounts for charge entering and leaving a junction. Branch currents add to the incoming current.^Voltage is a difference~It measures energy per charge between points. A battery provides a potential difference.^Resistance limits current~Ohm’s law models ohmic components. More resistance reduces current at fixed voltage.^Power becomes other energy~Electrical input can become light, motion and heat. A lamp warms as it shines.^Complete paths matter~Current requires a conducting path. Opening a switch interrupts a simple circuit.',
'Voltage~Energy difference per unit charge, in volts (V).^Current~Charge flow per second, in amperes (A).^Resistance~Opposition to current, in ohms (Ω).^Circuit~Connected electrical path.^Watt~Unit of power, written W.',
'Paper exercise: an ideal 6 V source is connected across a 300 Ω resistor.^Let V be voltage, R resistance and I current. For an ohmic resistor, I = V ÷ R.^I = 6 ÷ 300 = 0.02 A, or 20 milliamperes.^Power P = V × I = 0.12 W. Real components have ratings and tolerances. Do not experiment with mains electricity.',
'Voltage flows through a wire~Current flows; voltage is measured between points.^Low voltage always means harmless~Risk also depends on current capacity, energy, conditions and exposure.',
'What is the current in the example?~0.02 A, or 20 mA.^What happens when a simple circuit is opened?~Its continuous conducting path is interrupted.^Why define voltage between two points?~It is a potential difference, not a flow.',
'Learn circuit diagrams using paper or a safe simulator.','algebra~Rearranges circuit relationships.^physics~Explains charge and energy.','Basic arithmetic; algebra is helpful.');
L('health','medicine','Medicine',
'Body function~Normal and abnormal^Assessment~History and examination^Evidence~Tests and probability^Care~Benefits and harms^Prevention~Risk reduction',
'Symptoms are clues~A symptom can have several causes. Tiredness alone does not identify one disease.^Tests update probability~Results need context. A positive result may be misleading when a condition is very rare.^Benefits and harms coexist~Treatments require comparison. A medicine can help a condition while causing side effects.^Person-centred care~Goals and circumstances matter. Treatment plans must consider allergies and daily needs.^Prevention reduces risk~Protection is rarely absolute. Hygiene can lower infection risk without eliminating it.',
'Symptom~Change experienced by a person.^Sign~Finding observed or measured by someone else.^Diagnosis~Reasoned identification of a condition.^Sensitivity~Fraction of affected people a test detects.^Specificity~Fraction of unaffected people a test correctly excludes.',
'Educational hypothetical: among 1,000 people, 10 have a condition.^A test detects all 10 but falsely flags 5% of the 990 unaffected people: about 50.^About 60 results are positive, but only 10 are true positives: roughly one in six.^This simplified example shows why prevalence and follow-up matter; it is not a diagnostic rule.',
'A positive test is a definite diagnosis~Interpretation depends on accuracy, prevalence and clinical context.^One person’s recovery proves a treatment works~Recovery may have other causes; controlled evidence is needed.',
'Why can a rare-condition screen produce many false positives?~Many unaffected people are tested, so even a small false-positive rate adds up.^What is a symptom?~A change experienced by the person.^Why discuss allergies before treatment?~Individual risks can change the safest choice.',
'Study body systems and how clinical evidence is assessed. Personal decisions require qualified care and current local guidance.','biology~Explains normal body function.^statistics~Explains test interpretation.');
L('health','nursing','Nursing',
'Assessment~Observe and listen^Care planning~Needs and goals^Safety~Checks and prevention^Communication~Records and handover^Evaluation~Response and revision',
'Assessment is ongoing~Needs change over time. New confusion prompts reassessment rather than an old assumption.^Person-centred goals~Care reflects the person’s priorities and abilities. A mobility plan considers their home routine.^Safety uses systematic checks~Reliable processes reduce avoidable harm. Identity checks help prevent a wrong-person intervention.^Clear handover supports continuity~Relevant observations must reach the next caregiver. Report a new change with its timing.^Evaluation closes the loop~Compare outcomes with goals. Revise a comfort plan when discomfort persists.',
'Assessment~Structured collection of relevant information.^Care plan~Agreed actions linked to needs and goals.^Handover~Transfer of care information and responsibility.^Consent~Informed, voluntary agreement.^Vital signs~Measurements such as pulse and temperature.',
'A fictional patient says walking to the door feels harder today.^Listen, record the change and compare with earlier observations within your role.^Communicate concerns to the responsible clinician using clear timing and facts.^Agree appropriate support and reassess the response. This illustrates a care process, not instructions for treating a symptom.',
'Nursing is only following orders~Nursing includes skilled assessment, advocacy and evaluation within professional scope.^A normal measurement rules out concern~Trends, symptoms and context can still be important.',
'Why record when a change began?~Timing helps the team interpret and respond to it.^What makes a goal person-centred?~It reflects the person’s needs, choices and circumstances.^What follows an intervention?~Reassessment of its effect and any new risks.',
'Study structured communication and infection prevention. Scope and protocols depend on jurisdiction and setting.','medicine~Connects observations to clinical care.^psychology~Supports communication and behaviour understanding.');
L('health','pharmacy','Pharmacy',
'Drug action~Effects on the body^Drug handling~Absorption and removal^Use~Dose and route^Safety~Interactions and errors^Evidence~Benefits and monitoring',
'Dose affects response~Effects depend on amount and exposure. A larger dose can raise harm rather than benefit.^Route changes exposure~How a drug enters the body matters. An injection and tablet may act differently.^Elimination takes time~The body removes medicines at different rates. Repeated doses can accumulate.^Interactions change effects~Medicines, foods and conditions can interact. A second drug may alter removal of the first.^Verification prevents errors~Check the exact substance, strength and instructions. Similar packaging does not mean identical contents.',
'Dose~Amount given at one time.^Route~Way a medicine enters the body.^Interaction~One factor changing another treatment’s effect.^Half-life~Time for an amount to fall by half in a stated model.^Adverse effect~Unwanted harmful effect.',
'Hypothetical model only: a substance starts at 80 units and has a two-hour half-life.^Assume a single exposure and elimination that removes a constant fraction per hour, with no further input.^After two hours, 40 units remain; after four hours, 20; after six, 10.^Real drugs may follow more complex behaviour. This does not determine a safe dose or dosing interval.',
'Twice the dose means twice the benefit~Effects can be nonlinear and toxicity may increase.^Herbal products cannot interact~Active substances can interact regardless of their origin.',
'In the model, how much remains after four hours?~20 units.^Why does route matter?~It changes how and when a substance reaches the body.^Who should check a suspected interaction?~A qualified pharmacist or clinician using current, individual information.',
'Learn how medicine labels and evidence are evaluated. Regulations and personal treatment decisions require current local advice.','chemistry~Explains drug molecules.^medicine~Connects medicines to clinical goals.');
L('health','nutrition','Nutrition',
'Energy~Intake and use^Nutrients~Roles and sources^Patterns~Meals over time^Individual needs~Age and context^Evidence~Claims and limitations',
'Patterns matter~Habitual eating matters more than one meal. A varied week reveals more than one snack.^Nutrients have different roles~Energy alone does not describe nourishment. Beans provide fibre and protein as well as energy.^Energy balance is dynamic~Intake and use influence body stores over time. Activity and illness can change needs.^Needs vary~Age, health and circumstances affect requirements. Pregnancy and food allergies change planning.^Evidence beats single claims~A food headline may overstate a study. Consider study design and the full dietary pattern.',
'Nutrient~Substance needed for body functions.^Protein~Nutrient supplying amino acids.^Fibre~Carbohydrate not digested by human enzymes.^Energy density~Food energy per unit mass.^Deficiency~Insufficient supply of a needed nutrient.',
'Compare two hypothetical labels using the same serving size.^Snack A contains 3 g fibre and snack B 1 g per serving.^Two servings of A provide 6 g fibre; two of B provide 2 g.^Also compare salt, ingredients, cost and dietary needs. Fibre alone cannot establish which choice suits a person.',
'One food determines health~Long-term patterns and many non-food factors contribute.^All people need identical diets~Needs and suitable foods vary with circumstances.',
'Why compare equal serving sizes?~Different sizes can make label comparisons misleading.^Does high energy content prove poor nutrition?~No; energy and nutrient quality are different questions.^How much fibre is in two servings of A?~6 g.',
'Learn food-label interpretation and balanced meal patterns. Individual diets may require a qualified dietitian and local guidance.','biology~Explains digestion and metabolism.^public-health~Examines food access across populations.');
L('health','public-health','Public health',
'Populations~Patterns and inequalities^Prevention~Reduce exposure^Surveillance~Track change^Interventions~Evaluate effects^Equity~Access and fairness',
'Population rates need denominators~Counts alone mislead. Ten cases in a village differ from ten in a city.^Prevention acts upstream~Changing conditions can reduce many illnesses. Clean water interrupts exposure before treatment is needed.^Association needs investigation~Patterns suggest hypotheses, not automatic causes. A cluster needs comparison and context.^Interventions need evaluation~Measure benefits and unintended effects. A campaign’s reach is not the same as improved outcomes.^Equity shapes impact~Barriers affect who benefits. Clinic hours may exclude shift workers.',
'Incidence~New cases in a population over a period.^Prevalence~Existing cases at a point or over a stated period.^Risk factor~Characteristic linked to likelihood of an outcome.^Surveillance~Systematic collection and interpretation of health data.^Equity~Fair opportunity, accounting for differing needs.',
'In one year, town A reports 20 new cases among 2,000 people; town B reports 30 among 10,000.^Assume comparable case definitions and populations at risk.^A: 20 ÷ 2,000 × 1,000 = 10 new cases per 1,000 people; B: 3 per 1,000.^B has more cases but a lower crude annual risk. Age differences and detection can still affect interpretation.',
'More cases always mean higher risk~Population size and time period must be considered.^Population advice fits every individual~Personal conditions can require different clinical guidance.',
'Which town has the higher crude risk?~Town A.^Why state the time period?~New cases accumulate over time, so periods must be comparable.^Why consider clinic hours?~Access barriers affect who can benefit.',
'Study outbreak investigation and prevention evaluation. Policy depends on location, time and evidence.','statistics~Supports rate comparisons.^sociology~Explains social conditions shaping health.');
L('health','psychology','Psychology',
'Cognition~Attention and memory^Learning~Experience and behaviour^Emotion~Feelings and regulation^Social context~Other people^Methods~Evidence and ethics',
'Behaviour has multiple influences~Biology, experience and context interact. Sleep and stress can both affect concentration.^Memory is reconstructive~Recall is rebuilt rather than replayed perfectly. Witnesses may remember details differently.^Learning uses feedback~Consequences and practice shape behaviour. Timely feedback can improve a skill.^Context changes behaviour~Situations influence choices. A noisy room can disrupt performance without indicating low ability.^Claims need careful methods~Experiments and observations have limits. A small convenience sample may not generalise.',
'Cognition~Processes involved in thinking and knowing.^Reinforcement~Consequence increasing a behaviour’s future likelihood.^Working memory~Limited temporary mental workspace.^Bias~Systematic tendency affecting judgment.^Reliability~Consistency of a measurement.',
'A learner wants to remember five new words.^Read each word and its meaning, then hide the meanings and try recalling them.^Check mistakes and practise again after a delay.^This uses retrieval practice and spacing, established learning approaches. Improvement varies with task, sleep and prior knowledge; it is not a mental-health treatment.',
'Psychology is mind reading~It uses evidence to study behaviour and mental processes.^One label explains a whole person~People vary widely; diagnosis needs qualified assessment and context.',
'Why recall before rereading?~It practises retrieving information and exposes gaps.^Is vivid memory necessarily accurate?~No; confidence and detail do not guarantee accuracy.^Why consider the testing environment?~Context can influence observed behaviour.',
'Study learning, memory and research design. Clinical concerns require qualified individual assessment.','statistics~Helps evaluate psychological studies.^teaching-methods~Applies learning research.');
L('business','accounting','Accounting',
'Transactions~Economic events^Dual effect~Balanced records^Timing~Accruals and cash^Reports~Position and performance^Controls~Evidence and checks',
'Dual aspect~Transactions have balanced effects. Buying equipment with cash exchanges one asset for another.^Accounting equation~Assets equal liabilities plus equity. A loan increases cash and the obligation to repay.^Accrual convention~Record economic activity when earned or incurred under the applicable framework. An unpaid earned sale can create revenue and a receivable.^Profit differs from cash~Timing and investment separate them. Loan proceeds increase cash without creating sales revenue.^Evidence and reconciliation~Records need support and comparison. Match bank records to the ledger to find omissions.',
'Asset~Controlled economic resource.^Liability~Present obligation.^Equity~Residual interest after liabilities.^Revenue~Income from ordinary activities.^Expense~Resource consumption or obligation reducing profit.',
'Simplified business: owner invests 1,000 currency units. Cash and equity each rise by 1,000.^Buy equipment for 300 cash: cash falls to 700 and equipment rises to 300.^Assets remain 1,000, liabilities zero and equity 1,000. Under double-entry convention, debit equipment 300 and credit cash 300.^There is no immediate 300 expense in this simplified capital purchase. Depreciation, tax and recognition rules depend on the framework.',
'Debit always means loss~Debit is an entry side; its effect depends on the account.^Cash received always equals revenue~Loans and owner contributions are other sources of cash.',
'Does the equipment purchase immediately reduce total assets here?~No; it exchanges cash for equipment.^Why does a loan not create profit?~It creates a repayment liability, not earned revenue.^What must reconcile?~Assets with liabilities plus equity, and records with supporting evidence.',
'Learn double-entry postings and the three main financial statements. Rules vary by jurisdiction and reporting framework.','algebra~Supports balance equations.^finance~Uses statements to assess funding and cash flows.');
L('business','finance','Finance',
'Time~Present and future value^Risk~Uncertain outcomes^Return~Income and gains^Diversification~Spread exposure^Liquidity~Access to cash',
'Time value~Money now and later are not equivalent under a chosen discount rate. Earlier cash can earn a return.^Risk and return~Higher expected reward often involves more uncertainty, not a promise. A risky investment can lose value.^Diversification~Different exposures can reduce some concentration risk. Several independent customers reduce reliance on one.^Liquidity matters~An asset may be valuable but hard to sell quickly. Property cannot always pay an urgent bill.^Compounding~Returns on accumulated amounts grow over time. Interest can earn further interest.',
'Principal~Starting amount invested or borrowed.^Interest~Charge or return for use of money.^Return~Gain or loss relative to an investment.^Liquidity~Ease of obtaining cash without major loss.^Discount rate~Rate used to value future cash today.',
'Hypothetical deposit: principal 100 units, annual interest rate 5%, compounded yearly.^After year one: 100 × 1.05 = 105.^After year two: 105 × 1.05 = 110.25.^The second year adds 5.25 because interest also earns interest. Ignore fees, taxes, inflation and default risk here; actual products and rules vary.',
'Higher expected return is guaranteed~Expectation describes uncertain outcomes.^Diversification removes all risk~Shared market shocks and other risks remain.',
'Why is second-year interest larger?~It applies to the original principal plus earlier interest.^Can an illiquid asset be valuable?~Yes, value and ready access to cash differ.^What does 5% mean in the example?~Five units per hundred per year on the opening annual balance.',
'Study budgets, cash flows and risk comparison. This is education; choices depend on personal circumstances, country and date.','accounting~Provides financial records.^statistics~Explains uncertain outcomes.','Arithmetic, fractions and percentages.');
L('business','management','Management',
'Purpose~Goals and priorities^Planning~Resources and tasks^Coordination~Roles and communication^Motivation~People and incentives^Control~Feedback and adjustment',
'Goals guide action~Specific outcomes align decisions. A delivery target is clearer than “do better”.^Constraints shape plans~Time, people and money are limited. A small team must choose priorities.^Delegation needs clarity~Responsibility requires authority and expectations. A shift leader needs to know what they may decide.^Incentives influence behaviour~Measures can distort effort. Rewarding speed alone may reduce quality.^Feedback supports adaptation~Plans need revision when conditions change. A supplier delay should trigger replanning.',
'Goal~Desired outcome.^Stakeholder~Person or group affected by work.^Delegation~Assigning responsibility and suitable authority.^Indicator~Measure used to track something.^Constraint~Limit on possible action.',
'A team must pack 100 orders today.^Two workers each pack 10 orders per hour, giving 20 per hour together under the simplified assumption of equal independent work.^Packing needs 100 ÷ 20 = 5 working hours.^Add time for checks, breaks and interruptions. Compare actual progress halfway through and adjust rather than treating capacity as guaranteed.',
'Management means giving orders~It also involves coordination, listening and removing obstacles.^A metric is the goal itself~A measure is only a partial signal of the desired outcome.',
'Why include quality alongside speed?~Speed-only incentives may encourage mistakes.^What can invalidate the five-hour estimate?~Interruptions, unequal work, bottlenecks or rework.^Why clarify delegated authority?~People need to know which decisions they can make.',
'Learn team communication and process improvement.','project-management~Coordinates temporary goals.^psychology~Explains motivation and group behaviour.');
L('business','marketing','Marketing',
'Customers~Needs and context^Value~Benefits and costs^Positioning~Meaningful difference^Channels~Reach and access^Learning~Feedback and evidence',
'Value is customer-relative~Benefits depend on a person’s task. Fast delivery matters more for urgent supplies.^Segmentation is a model~Grouping customers can guide choices but must not erase individual differences. Commuters may share timing needs.^Positioning requires relevance~A difference matters only if valued. A repair guarantee can reduce buyer uncertainty.^Exchange includes trust~Misleading claims undermine sustainable relationships. Clear terms reduce disappointment.^Measurement needs comparison~Sales changes have multiple causes. A controlled offer test is stronger than guessing from one busy week.',
'Segment~Group defined by relevant shared characteristics.^Positioning~Intended place of an offering in customers’ minds.^Channel~Route for communication or distribution.^Conversion~Desired action following an interaction.^Value proposition~Statement of intended customer benefit.',
'A shop tests two equally priced signs on comparable randomly assigned days.^Sign A brings 20 purchases from 200 visitors: 10%. Sign B brings 30 from 200: 15%.^The observed difference is 5 percentage points, not proof of a permanent effect.^Check sample uncertainty, stock availability and fairness of assignment before changing the campaign.',
'Marketing is only advertising~It also includes understanding needs, designing value and delivering it.^More visitors always mean success~Profit, customer fit and retention also matter.',
'What is B’s observed conversion rate?~15%.^Why compare similar conditions?~Other differences could explain the result.^Does every person in a segment behave alike?~No; segmentation is a simplifying model.',
'Learn customer interviews and ethical experiment design.','statistics~Evaluates tests.^ux-design~Connects promises to the experience of use.');
L('business','economics','Economics',
'Scarcity~Limited resources^Choice~Opportunity cost^Incentives~Responses and trade-offs^Markets~Supply and demand^Institutions~Rules and external effects',
'Opportunity cost~Choosing uses resources that could serve alternatives. Studying tonight may replace paid work or rest.^Marginal reasoning~Compare the next increment’s benefit and cost. One more delivery may cost more than it earns.^Incentives influence choices~People respond to changed rewards and constraints. Higher parking fees may alter travel decisions.^Supply and demand are models~Prices can coordinate buyers and sellers under assumptions. A shortage may put upward pressure on price.^External effects matter~Costs or benefits can fall on others. Pollution can harm people outside a transaction.',
'Scarcity~Resources are limited relative to wants.^Opportunity cost~Value of the best forgone alternative.^Marginal~Related to one additional unit.^Demand~Quantities buyers are willing and able to buy at different prices.^Externality~Effect on others outside a transaction not fully reflected in its price.',
'A stall can make one extra sandwich for 3 units of additional cost.^A customer will pay 5, and spare capacity exists.^Additional benefit minus additional cost is 5 − 3 = 2 units, so the extra sale adds 2 before other effects.^If it displaces a better order or creates overtime, include that opportunity cost. This is a simplified marginal model.',
'Cost means only money paid~Forgone alternatives can also be costs.^Economic models predict everyone exactly~Models simplify behaviour and depend on context and assumptions.',
'What is the extra contribution in the example?~2 currency units.^Why consider a displaced order?~It is an opportunity cost.^Why can pollution distort market outcomes?~Some costs fall on people outside the purchase.',
'Explore market equilibrium and its limitations.','finance~Studies money across time.^political-science~Studies institutions shaping economic choices.');
L('business','entrepreneurship','Entrepreneurship',
'Problems~Customer needs^Experiments~Test assumptions^Business model~Value and revenue^Resources~Cash and capabilities^Learning~Adapt or stop',
'A problem comes before a solution~Demand cannot be assumed. Talk to potential buyers before building an app.^Assumptions need tests~Small experiments reduce uncertainty. A paid trial tests willingness to pay better than compliments.^Revenue is not profit~Costs consume sales income. A busy stall can still lose money.^Cash runway limits time~A venture needs enough cash to keep operating. Unpaid invoices cannot immediately fund wages.^Adaptation needs evidence~Change course when assumptions fail. Repeated unused trials suggest revisiting the need.',
'Business model~How an organisation creates and captures value.^Prototype~Early version for testing.^Fixed cost~Cost not changing with output within a stated range.^Contribution~Revenue minus variable cost.^Break-even~Point where total revenue equals total cost.',
'A simple workshop has fixed monthly costs of 200 units.^Each item sells for 10 and has variable cost of 6, so contribution is 4 per item.^Break-even quantity = fixed costs ÷ contribution = 200 ÷ 4 = 50 items.^Assume all units sell and costs remain constant. Taxes, financing and capacity can change the result.',
'A popular idea guarantees buyers~Interest is not the same as paying demand.^Growth solves all problems~Growing a loss-making process may increase losses and cash pressure.',
'What is contribution per item?~4 units.^At 40 sales, is the model breaking even?~No; contribution is 160 against 200 fixed costs.^Why test with real users early?~To learn whether the problem and solution matter before committing more resources.',
'Plan a small ethical customer experiment. Legal and financial obligations depend on location and business type.','accounting~Tracks costs and performance.^marketing~Tests customer needs.');
L('social','sociology','Sociology',
'Structure~Institutions and roles^Culture~Norms and meaning^Inequality~Resources and power^Interaction~Groups and identity^Research~Methods and evidence',
'Context shapes opportunity~Choices occur within social conditions. Bus access can affect employment options.^Norms are learned~Shared expectations vary across groups. Greeting practices differ without one being naturally universal.^Institutions organise life~Stable arrangements shape repeated behaviour. School schedules influence family routines.^Perspectives are analytical lenses~Theories highlight different processes. Conflict approaches examine power in workplace rules.^Evidence needs scale awareness~Group patterns do not describe every individual. Neighbourhood averages cannot determine one resident’s income.',
'Norm~Shared expectation about behaviour.^Institution~Enduring social arrangement.^Socialisation~Learning social practices and expectations.^Inequality~Unequal access to valued resources or opportunities.^Agency~Capacity to act within conditions.',
'A town observes lower evening-class attendance in one district.^Compare transport, work hours, fees and childcare rather than assuming low motivation.^Interview residents with consent and compare attendance across similar groups.^If transport is a barrier, pilot a later bus and evaluate changes. Observational evidence alone cannot isolate every cause.',
'Social explanations deny personal choice~Structure and agency can both matter.^A group average describes every member~Individuals vary within groups.',
'Why investigate bus access?~It may constrain attendance independently of motivation.^What is a norm?~A shared expectation about behaviour.^Why use several research methods?~Different methods reveal different aspects and limitations.',
'Compare surveys, interviews and observation.','public-health~Connects social conditions to health.^anthropology~Explores cultural meanings in context.');
L('social','political-science','Political science',
'Power~Influence and authority^Institutions~Rules and offices^Participation~Voice and representation^Policy~Collective decisions^Comparison~Evidence across systems',
'Power has multiple forms~Influence can come from resources, rules or persuasion. Agenda-setting affects which issues get discussed.^Institutions shape incentives~Rules influence political behaviour. Voting procedures affect representation.^Legitimacy differs from force~Accepted authority is not identical to coercive capacity. People may comply because they see a process as fair.^Collective action is difficult~Shared interests do not ensure coordination. Residents may want clean parks but wait for others to organise.^Evidence and values differ~Effects can be studied while goals remain debated. A policy may lower costs yet raise fairness concerns.',
'State~Political organisation governing a territory and population.^Government~People and institutions exercising governing authority.^Legitimacy~Perceived rightfulness of authority.^Representation~Acting or speaking for others in political decisions.^Policy~Chosen course of public action.',
'A fictional council must allocate 100 budget units between a park and a clinic.^List needs, expected effects and affected groups.^Compare two proposals using stated criteria, such as access and cost.^A vote selects a proposal under local rules, but does not establish that everyone’s interests were equally represented. Real powers and procedures vary by jurisdiction.',
'Politics is only elections~Institutions, administration and informal power also matter.^One system works identically everywhere~History, enforcement and social conditions alter outcomes.',
'How can agenda-setting exercise power?~It influences which options are considered.^Does a vote prove a policy is effective?~No; effectiveness needs separate evidence.^Why state evaluation criteria?~They reveal the values and trade-offs behind a comparison.',
'Study institutions and compare policy evaluation methods.','law~Defines formal powers and constraints.^economics~Analyses allocation and incentives.');
L('social','anthropology','Anthropology',
'Culture~Learned practices^Fieldwork~Observation and listening^Comparison~Variation and similarity^Human past~Material and biological evidence^Reflexivity~Researcher position and ethics',
'Context gives meaning~An action must be understood within local relationships. A gift may express obligation as well as generosity.^Cultural variation is normal~Practices are not ranked by familiarity. Meal customs differ across communities.^Ethnography values lived experience~Sustained observation and conversation reveal everyday meanings. Interviews alone may miss routines.^Reflexivity improves inquiry~Researchers examine their own assumptions and influence. Their presence may change behaviour.^Ethics limits methods~Consent and potential harms matter. Sensitive stories should not be exposed without agreement.',
'Culture~Learned and shared, yet changing, ways of living.^Ethnography~Detailed contextual study of social life.^Fieldwork~Research conducted among people or in relevant settings.^Ethnocentrism~Judging others solely by one’s own cultural standards.^Reflexivity~Examining one’s role and assumptions in research.',
'A researcher studies market bargaining with community permission.^Observe several transactions without recording identifiable details unnecessarily.^Ask participants what bargaining means to them and compare explanations with observations.^Consider how the researcher’s language and status affect responses. One market cannot represent every market or every member of a culture.',
'Cultures are fixed and uniform~They change and contain disagreement and diversity.^Understanding a practice means endorsing it~Contextual explanation does not remove ethical evaluation.',
'Why ask participants about meaning?~An outsider may misinterpret an observed action.^What is reflexivity?~Examining how the researcher affects knowledge production.^Can one interview represent an entire culture?~No; variation and scope must be considered.',
'Learn ethical observation and compare archaeological evidence.','sociology~Studies social patterns and institutions.^history~Connects present practices to change over time.');
L('social','law','Law',
'Sources~Legislation and decisions^Jurisdiction~Authority and location^Interpretation~Meaning and application^Procedure~Fair process and evidence^Remedies~Responses to wrongs',
'Jurisdiction comes first~Applicable rules depend on authority and location. A tenancy rule can differ between countries.^Sources have authority~Not every statement about law is law. Official legislation differs from an online opinion.^Facts and rules interact~A conclusion depends on both. Contract wording and what happened must be examined together.^Procedure matters~Legal processes govern evidence and opportunities to respond. A claim can require a filing deadline.^Interpretation can be contested~Reasonable disputes arise about wording and precedent. A court may resolve an ambiguous term differently from a lay reader.',
'Jurisdiction~Authority to make or apply law.^Statute~Law enacted by a legislative body.^Precedent~Earlier decision relevant to later cases, with force varying by system.^Liability~Legal responsibility.^Remedy~Legal response such as compensation or an order.',
'Fictional exercise: a written agreement promises delivery on Monday, but goods arrive Wednesday.^Identify the relevant jurisdiction and current governing rules before drawing a conclusion.^Check the agreement, evidence of timing, exceptions and any proved loss.^Possible remedies depend on those facts and rules. This exercise teaches method; it does not decide a real legal claim.',
'An unfair event is automatically unlawful~Legal rights depend on applicable rules and facts.^An internet answer applies everywhere~Country, date, legal system and circumstances can change the answer.',
'What should be identified before applying a rule?~The relevant jurisdiction and current legal source.^Why keep delivery records?~They provide evidence of facts.^Does a breach always produce the same remedy?~No; available responses depend on law and circumstances.',
'Learn how to locate current official legal sources. Real cases require qualified local advice.','political-science~Explains lawmaking institutions.^philosophy~Examines justice and justification.');
L('social','international-relations','International relations',
'Actors~States and organisations^Sovereignty~Authority and borders^Cooperation~Agreements and institutions^Conflict~Security and interests^Global links~Trade and shared risks',
'Actors have different interests~Countries and non-state groups do not share one goal. River users may value irrigation and electricity differently.^Sovereignty has practical limits~States claim authority but remain interdependent. Pollution can cross borders.^Cooperation needs credible commitments~Agreements work better when compliance can be assessed. Shared water measurements can support trust.^Security can create dilemmas~Defensive actions may alarm others. More border forces can be interpreted as preparation for attack.^Theories are lenses~Realist, liberal and constructivist approaches emphasise different explanations. No single lens settles every conflict.',
'Sovereignty~Claim to supreme authority within a territory and independence externally.^Diplomacy~Managing relations through communication and negotiation.^Treaty~Formal international agreement governed by international law.^Interdependence~Mutual reliance across actors.^Sanction~Restrictive measure intended to influence conduct.',
'Two fictional states share a river.^List upstream energy needs and downstream farming needs.^Propose minimum flows, shared measurements and a dispute process.^Check drought conditions and incentives to comply. Cooperation is possible but not guaranteed; domestic politics and power can alter the outcome.',
'Only states influence international affairs~Firms, organisations and social movements also matter.^A treaty guarantees compliance~Monitoring, incentives, capacity and politics affect implementation.',
'Why share river measurements?~They reduce uncertainty and allow compliance checks.^What is a security dilemma?~One actor’s defensive measure makes another feel less secure.^Why use more than one theory?~Different lenses highlight different mechanisms and assumptions.',
'Compare explanations of cooperation in one historical case.','history~Provides context for relations.^climate-science~Studies shared cross-border risks.');
L('humanities','history','History',
'Sources~Evidence and provenance^Context~Time and place^Chronology~Sequence and duration^Causation~Multiple explanations^Interpretation~Arguments and uncertainty',
'Sources require criticism~Ask who created evidence and why. A ruler’s inscription may praise achievements selectively.^Context changes meaning~Avoid imposing today’s assumptions automatically. A historical title may not match a modern office.^Sequence is not causation~Earlier events do not automatically cause later ones. A tax increase may be one of several causes of unrest.^Corroboration strengthens claims~Compare independent evidence. A diary and shipping record may jointly support a voyage date.^Interpretations are argued~Accounts should explain their evidence and limits. Historians may disagree about the relative importance of economic and political causes.',
'Primary source~Evidence originating in the period or activity studied.^Secondary source~Later analysis of evidence.^Chronology~Ordering events in time.^Provenance~Origin and history of a source.^Anachronism~Placing something in an inappropriate historical time.',
'A fictional diary says a market opened in 1890.^Ask when the diary was written and whether its author witnessed the opening.^Compare a dated council record and newspaper report, checking whether one copied the other.^Conclude only as strongly as the evidence allows: several independent contemporary records may support 1890, while later recollection alone is weaker.',
'Primary sources are automatically accurate~Contemporary witnesses can be mistaken, partial or deceptive.^History is just dates~It also studies change, explanation, experience and evidence.',
'Why check whether two reports copied each other?~They may represent one source rather than independent corroboration.^What is an anachronism?~Using something inappropriate to the period being described.^Does timing alone prove a cause?~No; mechanisms and alternatives need investigation.',
'Compare two sources describing the same event.','anthropology~Adds cultural context.^literature~Develops close reading of texts.');
L('humanities','philosophy','Philosophy',
'Arguments~Reasons and conclusions^Knowledge~Evidence and doubt^Reality~Concepts and existence^Ethics~Values and action^Dialogue~Objections and revision',
'Reasons support conclusions~An assertion needs justification. “This policy is fair” requires an account of fairness.^Validity differs from truth~An argument’s structure can work even with false premises. Check both reasoning and starting claims.^Concepts need clarity~Ambiguous words can hide disagreement. “Freedom” might mean lack of restraint or practical ability.^Counterexamples test claims~One case can challenge a universal statement. A white swan does not prove all swans are white.^Ethical frameworks differ~Consequences, duties and virtues emphasise different considerations. A promise can create tension between duty and benefit.',
'Premise~Claim offered as a reason.^Conclusion~Claim an argument supports.^Validity~Property of deductive reasoning where true premises would guarantee the conclusion.^Ethics~Study of how one ought to act.^Counterexample~Case challenging a general claim.',
'Consider: “All squares have four sides. This shape is a square. Therefore it has four sides.”^Identify the two premises and the conclusion.^If the premises are true, the conclusion must follow; the argument is valid.^Now check whether the pictured shape really is a square. Valid reasoning alone cannot establish that factual premise.',
'Philosophy is only personal opinion~It evaluates arguments, distinctions and objections.^Disagreement makes every answer equally good~Some arguments have stronger reasons or fewer contradictions.',
'Can a valid argument contain a false premise?~Yes; validity concerns the relation between premises and conclusion.^How can a universal claim be challenged?~By a genuine counterexample.^Why define “fair”?~Different meanings may produce different judgments.',
'Compare a consequence-based and a duty-based ethical argument.','law~Uses reasoning about rules and justice.^religion~Engages questions of meaning and belief.');
L('humanities','religion','Religion',
'Traditions~Diversity within groups^Texts~Interpretation and authority^Practice~Ritual and community^Belief~Meaning and commitments^Study~History and perspectives',
'Internal diversity matters~Traditions contain varied schools and practices. Two members may interpret a text differently.^Insider and outsider perspectives differ~Devotional meaning and academic explanation answer different questions. A ritual may be both worship and a social practice.^Claims need appropriate methods~Historical evidence can study a text’s transmission without settling divine inspiration. Distinguish empirical claims from faith commitments.^Interpretation has context~Language, authority and history shape readings. Translations may emphasise different meanings.^Comparison requires care~Shared labels do not guarantee equivalent concepts. “Liberation” and “salvation” can have distinct meanings across traditions.',
'Ritual~Patterned action with shared significance.^Tradition~Practices and teachings transmitted and revised over time.^Theology~Reasoned study of divine matters within or about a tradition.^Secular~Relating to nonreligious domains or frameworks.^Hermeneutics~Study and practice of interpretation.',
'Compare descriptions of fasting in two traditions without assuming identical purposes.^Use each tradition’s own explanations and acknowledge differences within it.^Separate observed practices from believers’ theological explanations.^A Muslim account may emphasise Ramadan devotion; a Christian account may discuss Lenten practice. Neither example represents every member, and comparison does not judge the truth of faith claims.',
'All members of a religion believe exactly the same things~Traditions include interpretive and practical diversity.^Studying religion requires accepting or rejecting its beliefs~Respectful description and analysis can proceed without deciding faith commitments.',
'Why include insider explanations?~They help explain meanings participants give to practices.^Can archaeology alone settle a theological claim?~It can inform historical questions but cannot by itself settle every faith claim.^Why avoid treating one member as representative of all?~Beliefs and practices vary within traditions.',
'Study one tradition’s history using both scholarly and participant accounts.','history~Examines sources and change.^philosophy~Analyses arguments about meaning and knowledge.');
L('humanities','literature','Literature',
'Text~Words and form^Voice~Narrator and perspective^Imagery~Pattern and suggestion^Context~Genre and history^Interpretation~Evidence and alternatives',
'Close reading uses details~Interpretations need textual support. Repeated winter imagery may suggest emotional distance.^Narrator differs from author~A speaking voice is constructed. A dishonest narrator does not prove a dishonest author.^Form creates effects~Rhythm, order and genre influence meaning. A sudden short sentence can interrupt a flowing passage.^Context enriches reading~Historical conventions affect interpretation. A satire may imitate views it criticises.^Multiple readings need evidence~More than one interpretation can be defensible. A symbol’s meaning must fit the surrounding text.',
'Narrator~Voice telling a story.^Theme~Developed concern or question in a work.^Metaphor~Describing one thing through another.^Genre~Recognisable category of literary form.^Irony~Gap between appearance, statement or expectation and another meaning or outcome.',
'Read this original line: “The silent station held its breath as she left.”^Identify the literal scene: someone leaves a station.^“Held its breath” personifies the station, giving it a human action.^This may suggest tension or suspended emotion. Other readings are possible, but the words support more than a simple report of travel.',
'Every poem has one hidden correct meaning~Some interpretations differ while remaining textually supported.^The narrator always states the author’s views~A text may create distance, unreliability or irony.',
'What personification appears in the example?~The station “held its breath”.^What supports a literary interpretation?~Specific wording, structure and relevant context.^Why distinguish narrator from author?~The narrative voice may be invented and may hold different views.',
'Compare imagery and viewpoint in two short passages.','history~Supplies context.^languages~Builds sensitivity to wording and expression.');
L('humanities','languages','Languages',
'Meaning~Words in context^Sound~Listening and pronunciation^Structure~Patterns and grammar^Interaction~Purpose and register^Practice~Recall and feedback',
'Meaning depends on context~A word may have several uses. “Bank” can mean a financial institution or river edge.^Comprehension and production interact~Listening and reading support speaking and writing. A model dialogue helps prepare a request.^Grammar expresses relationships~Patterns connect meanings. Word order can show who acts on whom.^Register suits the situation~Language varies with audience and purpose. A formal request may differ from a message to a friend.^Spaced use strengthens learning~Repeated retrieval over time supports memory. Reuse new phrases in several situations.',
'Vocabulary~Words and expressions known or used.^Grammar~Patterns organising language.^Pronunciation~How speech sounds are produced.^Register~Style suited to a social situation.^Fluency~Ease and continuity of language use.',
'Practise asking for directions in a new language.^Learn a complete polite phrase and understand each part rather than memorising isolated sounds.^Listen to a reliable example, then say the phrase and check feedback.^Role-play a reply and ask for repetition. Success means conveying and understanding meaning, not achieving one ideal accent.',
'Word-for-word translation always works~Languages organise meanings differently.^Mistakes mean no learning~Errors can reveal what to practise next; useful feedback matters.',
'Why learn a phrase in context?~Its use, meaning and politeness become clearer.^What is register?~Style appropriate to audience and situation.^Why practise replies as well as questions?~Real communication requires understanding the response.',
'Learn high-frequency phrases for one real-life task.','linguistics~Explains how language systems work.^psychology~Explains memory and practice.');
L('humanities','linguistics','Linguistics',
'Sounds~Speech patterns^Words~Meaningful parts^Sentences~Structure^Meaning~Semantics and context^Variation~Communities and change',
'Description differs from prescription~Linguistics studies actual language patterns. A dialect feature is not simply a failed standard form.^Language is systematic~Speakers follow patterned rules, often unconsciously. Children extend plural patterns to new words.^Form and meaning interact~Structure affects interpretation. Different word orders can change who did what.^Context adds meaning~Utterances do more than state literal content. “Can you open the door?” commonly functions as a request.^Variation is normal~Language changes across speakers, settings and time. Formal and informal forms can both be rule-governed.',
'Phoneme~Sound category distinguishing meanings in a language.^Morpheme~Smallest unit carrying meaning or grammatical function.^Syntax~Patterns organising words into sentences.^Semantics~Study of conventional meaning.^Pragmatics~Study of meaning in context.',
'Analyse the English word “cats”.^Separate “cat”, the animal meaning, from “-s”, the plural marker.^These are two morphemes in this word.^Compare “dogs”: the same plural function occurs, though the final sound differs. English also has exceptions such as “children”, so one pattern is not the whole system.',
'A dialect has no grammar~Dialects have systematic grammatical patterns.^Writing is the whole of language~Spoken and signed languages also have complex structures.',
'How many morphemes are in “cats” here?~Two: “cat” and plural “-s”.^Why is “Can you open the door?” often more than a question about ability?~Context makes it a request.^Does variation imply disorder?~No; variation can itself follow patterns.',
'Compare word structure with sentence structure.','languages~Applies language awareness in learning.^anthropology~Connects language to culture.');
L('arts','visual-arts','Visual arts',
'Observation~Seeing relationships^Elements~Line, shape and colour^Composition~Arranging attention^Materials~Tools and process^Interpretation~Context and meaning',
'Relationships guide perception~Values and colours depend on surroundings. Grey can look lighter against black.^Composition directs attention~Placement and contrast influence viewing. A bright shape can become a focal point.^Materials shape possibilities~Tools have characteristic effects. Transparent watercolour behaves differently from opaque paint.^Making is iterative~Trials reveal possibilities. Thumbnail sketches test arrangements before a large work.^Meaning is contextual~Viewers and traditions bring different interpretations. A colour’s symbolism is not universal.',
'Value~Lightness or darkness.^Composition~Arrangement of visual elements.^Contrast~Noticeable difference between elements.^Medium~Material or process used to make art.^Texture~Actual or suggested surface quality.',
'Draw a mug using only three values: light, middle and dark.^Identify the light source and block in the largest shapes.^Group shadow areas into the dark value; reserve the lightest value for lit areas.^Compare proportions before adding detail. This is a study method, not a rule that all art must look realistic.',
'Art is only realistic drawing~Art includes many representational and abstract purposes.^Colour meanings are universal~Associations vary by culture, context and individual experience.',
'Why use three values first?~They simplify light relationships and reduce distracting detail.^What creates a focal point?~Placement, contrast and other compositional choices can guide attention.^Must every artwork imitate nature?~No; artistic purposes and traditions differ.',
'Create several small compositions using the same shapes.','graphic-design~Uses visual hierarchy for communication.^history~Explains artistic contexts.');
L('arts','music','Music',
'Time~Pulse and rhythm^Pitch~Melody and intervals^Harmony~Combined tones^Form~Patterns and sections^Expression~Timbre and dynamics',
'Rhythm organises time~Durations and accents create patterns. Clapping a repeated rhythm can accompany a steady pulse.^Pitch relationships matter~Intervals shape melodies. A tune remains recognisable when shifted higher.^Repetition and contrast create form~Returning material helps listeners follow structure. A chorus contrasts with a verse.^Timbre shapes perception~Sound quality distinguishes sources. A flute and violin can play the same pitch differently.^Musical conventions vary~Scales and tuning are culturally situated. Western major-minor harmony is not a universal system.',
'Beat~Regular underlying pulse.^Rhythm~Pattern of durations and accents.^Pitch~Perceived highness or lowness of sound.^Tempo~Speed of the pulse.^Timbre~Characteristic quality of a sound.',
'Set a comfortable pulse of 60 beats per minute.^This means one beat each second.^Clap once on beats 1 and 3 of a repeating four-beat group, while counting all four.^Then clap twice evenly within each beat. The pulse stays the same while the rhythm changes; this exercise uses one simple metrical convention.',
